[package]
name = "cfgd-crd"
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "cfgd Custom Resource Definition spec types, schemas, and cross-field validation"
keywords = ["kubernetes", "crd", "config", "schema"]
categories = ["config"]

[lib]
name = "cfgd_crd"
path = "src/lib.rs"

[dependencies]
# The config value types the local parser and this CRD schema share.
cfgd-schema = { path = "../cfgd-schema", version = "0.1.0" }
kube = { version = "4.0", features = ["derive"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
thiserror = "2"

[dev-dependencies]
serde_yaml = "0.9"
