cfgd-min-version = "<CFGD_MIN_VERSION>"
cfgd-version = "<CFGD_VERSION>"
description = "Author a complete, validated cfgd Source; use whenever creating or reworking a Source YAML."
prompt = '''
<!-- cfgd-version: <CFGD_VERSION> · cfgd-min-version: <CFGD_MIN_VERSION> -->

# Author a high-quality cfgd Source

Follow this protocol on every invocation. The quality bar is NOT "valid YAML". It is exhaustive field evaluation, external research, and a documented rationale for every choice. A box-checking resource (every field technically present, no investigation behind it) fails this bar. Evaluate EVERY field the kind exposes; for each, either populate it with a justified value or omit it only after investigating enough to conclude it does not apply. Ground every version, ordering, and strategy choice in evidence, never a guess.

## Protocol

0. **Precondition.** Run `cfgd --version`. If cfgd is absent, STOP and tell the user to install cfgd >= <CFGD_MIN_VERSION>; if it is older than <CFGD_MIN_VERSION>, warn and take the fallback branch in steps 1 and 5.
1. **Enumerate every field.** Run `cfgd explain source -o json` once. The payload is the complete field list step 3 walks: every field, nested ones under `children`, each with `type`, `description` and `required`; its `location` is the path the finished file goes to. `cfgd explain source.<field>` (no `-o`) prints one field's docs readably. Fallback: the embedded schema below (stamped <CFGD_VERSION>).
2. **Research THIS subject before choosing values.** Check the subject's own docs, the package managers that ship it (for a tool), and community conventions. On the target machine, `<tool> --version` and the manager's own query (`brew info`, `apt-cache policy`, …) are live evidence and outrank recall. Put what you verified, and where, in the field's WHY comment; where you could not confirm a claim, say so there and in your reply.
3. **Decide include or omit for EVERY field from step 1, and write the WHY as a comment beside each included one.** Omit a field the subject does not use or whose value would equal the default; note a non-obvious omission in a comment too.
4. **Draft.** Declare every dependency the subject needs at run time, transitive ones included. Set a version floor only where a feature needs it, and say which. Gate platform-specific entries with `platforms`. Make each script step safe to re-run (`onlyIf` / `unless` / `creates` where the kind offers them, or a command that is itself idempotent), give it a `timeout`, and set `continueOnError: true` only where a failure must not abort the apply. Never write a credential into a value; a secret belongs in the profile's `spec.secrets`. No placeholders, no stub comments.
5. **Validate:** `cfgd source validate <file>` (`-` reads stdin; add `-o json` for a parseable report). A non-zero exit lists every error with its line; fix and re-run until it prints `✓ … is valid`. Fallback: check the draft by hand against the embedded schema (required keys, types, enums) and tell the user it was not machine-validated.
6. **Self-critique.** For each field in the step-1 list, name the evidence behind its value or its omission; a field you cannot account for goes back to step 2.

## Ground-truth examples

Validated resources of this kind, shown for shape and depth. A value like `you@example.com` is the example's placeholder; your draft carries the real one.

```yaml
apiVersion: cfgd.io/v1alpha1
kind: ConfigSource
metadata:
  # replace ACME with your own organization throughout this file — the names,
  # paths and registries below are all illustrative
  name: acme-corp-dev
  # Bumped whenever the policy below changes, so a subscriber can pin a range.
  version: "2.1.0"
  description: ACME Corp developer environment baseline
spec:
  provides:
    profiles:
      - acme-base
      - acme-backend
      - acme-frontend
    # Picks the default profile per platform, so a subscriber does not have to
    # name one for the common case.
    platformProfiles:
      macos: acme-base
      debian: acme-backend
      ubuntu: acme-backend
      fedora: acme-frontend
      linux: acme-base
    modules:
      - corp-vpn
      - corp-certs
      - approved-editor

  policy:
    # required: applied without asking. Reserved for what a machine on the
    # corporate network cannot function (or be compliant) without.
    required:
      packages:
        brew:
          formulae:
            - git-secrets
            - pre-commit
            - aws-cli
      files:
        - source: linting/.eslintrc.json
          target: ~/.eslintrc.json
      modules:
        - corp-vpn
        - corp-certs
    # recommended: offered, and withheld until the subscriber decides (or
    # `subscription.acceptRecommended` answers for them).
    recommended:
      packages:
        brew:
          formulae:
            - k9s
            - stern
            - kubectx
      modules:
        - approved-editor
    # optional: never applied unless the subscriber opts in by name.
    optional:
      profiles:
        - acme-sre
    # locked: the subscriber may not override these, which is the point for a
    # security policy the source is accountable for.
    locked:
      files:
        - source: security/security-policy.yaml
          target: ~/.config/company/security-policy.yaml
    # What this source promises it will never do. A subscriber composes on the
    # strength of these, so widening one is a breaking change to the version
    # above.
    constraints:
      noScripts: true
      noSecretsRead: true
      allowedTargetPaths:
        - ~/.config/acme/
        - ~/.config/company/
```

