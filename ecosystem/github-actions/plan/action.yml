name: cfgd Plan
description: Run cfgd plan against a config repo and post the diff as a PR comment
branding:
  icon: settings
  color: blue

inputs:
  config-dir:
    description: Path to the cfgd configuration directory (must contain cfgd.yaml)
    required: false
    default: "."
  profile:
    description: Profile to plan (defaults to the config's active profile)
    required: false
    default: ""
  version:
    description: cfgd version to install (default latest)
    required: false
    default: "latest"
  args:
    description: Additional arguments to pass to cfgd plan
    required: false
    default: ""
  comment:
    description: Post the plan as a PR comment, updating one comment in place (true/false)
    required: false
    default: "true"
  fail-on-error:
    description: Fail the step when cfgd plan exits non-zero (true/false)
    required: false
    default: "true"
  fail-on-changes:
    description: Fail the step when the plan contains pending actions, for merge gates (true/false)
    required: false
    default: "false"
  github-token:
    description: GitHub token for posting PR comments
    required: false
    default: ${{ github.token }}

outputs:
  json:
    description: The plan as JSON (the -o json payload)
    value: ${{ steps.plan.outputs.json }}
  human:
    description: The human-readable plan output
    value: ${{ steps.plan.outputs.human }}
  has-changes:
    description: '"true" when the plan contains at least one action'
    value: ${{ steps.plan.outputs.has-changes }}
  total-actions:
    description: Number of actions in the plan
    value: ${{ steps.plan.outputs.total-actions }}
  exit-code:
    description: Exit code of cfgd plan
    value: ${{ steps.plan.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Install cfgd
      shell: bash
      env:
        CFGD_VERSION: ${{ inputs.version }}
      run: |
        if [ "$CFGD_VERSION" = "latest" ]; then
          curl -fsSL https://github.com/tj-smith47/cfgd/releases/latest/download/install.sh | bash
        else
          curl -fsSL "https://github.com/tj-smith47/cfgd/releases/download/v${CFGD_VERSION#v}/install.sh" | bash -s -- --version "$CFGD_VERSION"
        fi

    - name: Run cfgd plan
      id: plan
      shell: bash
      env:
        CONFIG_DIR: ${{ inputs.config-dir }}
        PROFILE: ${{ inputs.profile }}
        EXTRA_ARGS: ${{ inputs.args }}
      run: |
        # The default config path is ~/.config/cfgd/cfgd.yaml; CI must point at the
        # checked-out repo explicitly or the plan silently reads the runner's HOME.
        CONFIG="$CONFIG_DIR/cfgd.yaml"
        if [ ! -f "$CONFIG" ]; then
          echo "::error::no cfgd.yaml at '$CONFIG' (config-dir: '$CONFIG_DIR')"
          exit 1
        fi
        ARGS=(--config "$CONFIG")
        if [ -n "$PROFILE" ]; then
          ARGS+=(--profile "$PROFILE")
        fi
        # shellcheck disable=SC2206 # deliberate word-splitting of user-supplied args
        ARGS+=($EXTRA_ARGS)

        # A delimiter no line of the payload equals. The payload is a plan
        # rendered from the PR author's own config — module names, package
        # names, script bodies — so a fixed delimiter is a line the config can
        # write, ending the value early and leaving the rest of the plan to be
        # read as further output assignments.
        unique_delim() {
          local candidate
          while :; do
            candidate="${1}_${RANDOM}${RANDOM}${RANDOM}"
            if ! grep -qxF "$candidate" <<<"$2"; then
              printf '%s' "$candidate"
              return 0
            fi
          done
        }

        # The plan runs twice: once for the machine payload and once for the
        # human render, because there is no single invocation that emits both.
        # The JSON run is AUTHORITATIVE — its exit code is the step's, and the
        # gates downstream read its total. The human render is for the PR
        # comment alone; a disagreement between them means the machine moved
        # between the two runs, and is reported rather than hidden.
        #
        # JSON from stdout only: stderr carries progress/log noise that must not
        # corrupt the payload. The exit code is captured, never swallowed.
        set +e
        JSON=$(cfgd plan -o json "${ARGS[@]}" 2>"$RUNNER_TEMP/cfgd-plan-stderr.log")
        CODE=$?
        HUMAN=$(cfgd plan --no-color "${ARGS[@]}" 2>&1)
        HUMAN_CODE=$?
        set -e

        if [ "$HUMAN_CODE" != "$CODE" ]; then
          echo "::warning::the two cfgd plan runs disagreed (json exit $CODE, human exit $HUMAN_CODE); the JSON run is authoritative"
        fi

        TOTAL=$(jq -r '.totalActions // 0' <<<"$JSON" 2>/dev/null || echo 0)
        HAS_CHANGES=false
        if [ "$TOTAL" -gt 0 ] 2>/dev/null; then
          HAS_CHANGES=true
        fi

        # Actions caps a step output at ~1MB and GitHub caps a comment body at
        # 65536 chars; bound the render once, here, so neither the output write
        # nor the comment can fail on a large plan.
        HUMAN_TRUNCATED=$(printf '%s' "$HUMAN" | head -c 59000)
        if [ "$HUMAN_TRUNCATED" != "$HUMAN" ]; then
          HUMAN_TRUNCATED=$(printf '%s\n... (truncated; full output in the workflow run)' "$HUMAN_TRUNCATED")
        fi

        JSON_DELIM=$(unique_delim CFGD_JSON_EOF "$JSON")
        HUMAN_DELIM=$(unique_delim CFGD_HUMAN_EOF "$HUMAN_TRUNCATED")

        {
          echo "exit-code=$CODE"
          echo "total-actions=$TOTAL"
          echo "has-changes=$HAS_CHANGES"
          echo "json<<$JSON_DELIM"
          echo "$JSON"
          echo "$JSON_DELIM"
          echo "human<<$HUMAN_DELIM"
          echo "$HUMAN_TRUNCATED"
          echo "$HUMAN_DELIM"
        } >> "$GITHUB_OUTPUT"

        if [ "$CODE" -ne 0 ]; then
          echo "::group::cfgd plan stderr"
          cat "$RUNNER_TEMP/cfgd-plan-stderr.log"
          echo "::endgroup::"
        fi

    - name: Post PR comment
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PLAN_HUMAN: ${{ steps.plan.outputs.human }}
        PLAN_EXIT: ${{ steps.plan.outputs.exit-code }}
        PLAN_TOTAL: ${{ steps.plan.outputs.total-actions }}
        PLAN_HAS_CHANGES: ${{ steps.plan.outputs.has-changes }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        MARKER='<!-- cfgd-plan-action -->'
        BODY="$RUNNER_TEMP/cfgd-comment.md"

        {
          echo "$MARKER"
          echo "### cfgd Plan"
          echo
          if [ "$PLAN_EXIT" != "0" ]; then
            echo "**Plan failed** (exit code $PLAN_EXIT). See the workflow run for stderr."
          elif [ "$PLAN_HAS_CHANGES" = "true" ]; then
            echo "**$PLAN_TOTAL pending action(s).**"
          else
            echo "**No changes.** The machine state matches this configuration."
          fi
        } > "$BODY"

        if [ "$PLAN_EXIT" = "0" ]; then
          # Already bounded to 59000 chars by the plan step, which truncates on
          # the way into GITHUB_OUTPUT so the step output cannot overflow either.
          printf '\n<details>\n<summary>Plan output</summary>\n\n```\n%s\n```\n\n</details>\n' "$PLAN_HUMAN" >> "$BODY"
        fi
        printf '\n---\n*Generated by [cfgd](https://github.com/tj-smith47/cfgd)*\n' >> "$BODY"

        # Update the existing plan comment in place instead of stacking a new one per push.
        # `--jq` runs per PAGE, so `[…][0]` yields one id per page that holds a
        # match; `head -n1` keeps the capture a single id, which is all the
        # PATCH below can name.
        EXISTING=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
          --jq "[.[] | select(.body | startswith(\"$MARKER\"))][0].id // empty" | head -n1)
        if [ -n "$EXISTING" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" -F "body=@$BODY" >/dev/null
        else
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$BODY"
        fi

    - name: Enforce failure gates
      shell: bash
      env:
        PLAN_EXIT: ${{ steps.plan.outputs.exit-code }}
        PLAN_HAS_CHANGES: ${{ steps.plan.outputs.has-changes }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        FAIL_ON_CHANGES: ${{ inputs.fail-on-changes }}
      run: |
        if [ "$FAIL_ON_ERROR" = "true" ] && [ "$PLAN_EXIT" != "0" ]; then
          echo "::error::cfgd plan failed with exit code $PLAN_EXIT"
          exit "$PLAN_EXIT"
        fi
        if [ "$FAIL_ON_CHANGES" = "true" ] && [ "$PLAN_HAS_CHANGES" = "true" ]; then
          echo "::error::plan contains pending actions and fail-on-changes is set"
          exit 1
        fi
