apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cfgd-apply
  labels:
    app.kubernetes.io/version: "0.1"
  annotations:
    tekton.dev/pipelines.minVersion: "0.50.0"
    tekton.dev/categories: Configuration Management
    tekton.dev/tags: cfgd, configuration, dotfiles
    tekton.dev/displayName: cfgd Apply
spec:
  description: >-
    Run cfgd apply to reconcile machine configuration. Supports dry-run
    mode for plan preview and full apply for reconciliation.
  params:
    - name: config-dir
      type: string
      description: Path to cfgd configuration directory within the workspace
      default: "."
    - name: dry-run
      type: string
      description: Run in dry-run mode (true/false)
      default: "false"
    - name: args
      type: string
      description: Additional arguments to pass to cfgd apply
      default: ""
    - name: version
      type: string
      description: cfgd version to install
      default: "latest"
    - name: output-format
      type: string
      description: Output format (table, json, yaml)
      default: "table"
  workspaces:
    - name: source
      description: Workspace containing the cfgd configuration repository
  results:
    - name: plan
      description: >-
        The cfgd output (JSON when output-format is json). Tekton caps results
        at 4KB, so output larger than that arrives as its final 4KB; the step
        log always carries the full output.
  steps:
    - name: cfgd-apply
      image: ubuntu:22.04
      workingDir: $(workspaces.source.path)/$(params.config-dir)
      script: |
        #!/bin/bash
        set -euo pipefail

        # Install cfgd
        apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
        VERSION="$(params.version)"
        if [ "$VERSION" = "latest" ]; then
          curl -fsSL https://github.com/tj-smith47/cfgd/releases/latest/download/install.sh | bash
        else
          curl -fsSL "https://github.com/tj-smith47/cfgd/releases/download/v${VERSION#v}/install.sh" | bash -s -- --version "$VERSION"
        fi

        # Run cfgd
        DRY_RUN=""
        if [ "$(params.dry-run)" = "true" ]; then
          DRY_RUN="--dry-run"
        fi

        OUTPUT_FLAG=""
        if [ "$(params.output-format)" != "table" ]; then
          OUTPUT_FLAG="--output $(params.output-format)"
        fi

        # The default config path is ~/.config/cfgd/cfgd.yaml; the task must point
        # at the workspace checkout explicitly or apply silently reads the
        # step container's HOME. pipefail (set above) keeps a failed apply from
        # being masked by tee's exit code.
        # The exit code is captured rather than allowed to end the step here:
        # under `set -e` a failed apply would skip the result write below, so
        # downstream tasks would get no result precisely when they most need
        # one. The step still fails — with the apply's own code — after writing.
        set +e
        cfgd apply --yes --no-color --config ./cfgd.yaml $DRY_RUN $OUTPUT_FLAG $(params.args) | tee /tmp/cfgd-output.txt
        CODE=${PIPESTATUS[0]}
        set -e

        # Tekton caps a result at 4KB; ship the tail so the verdict survives
        # truncation, and point at the step log for the full output.
        tail -c 4000 /tmp/cfgd-output.txt > $(results.plan.path)

        exit "$CODE"
