apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: driftalerts.cfgd.io
spec:
  group: cfgd.io
  names:
    categories:
    - cfgd
    kind: DriftAlert
    plural: driftalerts
    shortNames:
    - da
    singular: driftalert
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.deviceId
      name: Device
      type: string
    - jsonPath: .spec.severity
      name: Severity
      type: string
    - jsonPath: .status.conditions[?(@.type=="Resolved")].status
      name: Resolved
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for DriftAlertSpec via `CustomResource`
        properties:
          spec:
            description: |-
              Drifted system settings a device reported at check-in.

              A device's report covers its system settings alone — the answers of the
              system configurators its profile declares (`sysctl`, `kernelModules`,
              `macosDefaults`, `windowsRegistry`, ...). Packages, managed files, env vars
              and aliases are checked on the device by `cfgd diff` and reach the fleet only
              as the aggregate counts of a compliance summary, never as findings — so a
              device with no DriftAlert is a device whose system settings matched, not a
              device proven in sync.
            properties:
              deviceId:
                description: Identifier of the device that reported the drift, as it enrolled.
                type: string
              driftDetails:
                default: []
                description: |-
                  One entry per drifted system setting, each carrying what was declared and
                  what the device found.
                items:
                  description: One system setting whose live value diverged from its declared value.
                  properties:
                    actual:
                      description: The value the device actually reported.
                      type: string
                    expected:
                      description: The value the MachineConfig declares.
                      type: string
                    field:
                      description: |-
                        The drifted setting, named `<configurator>.<key>` as the device reported
                        it (e.g. `sysctl.net.ipv4.ip_forward`).

                        The configurator qualifies the key because a key names a setting only
                        within its own configurator: two of them may declare the same one, and
                        this list merges by this field.
                      type: string
                  required:
                  - actual
                  - expected
                  - field
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - field
                x-kubernetes-list-type: map
              machineConfigRef:
                description: The MachineConfig whose desired state the device diverged from.
                properties:
                  name:
                    description: Name of the referenced MachineConfig.
                    type: string
                  namespace:
                    description: |-
                      Namespace the MachineConfig lives in. Omitted, the referring
                      resource's own namespace is used.
                    nullable: true
                    type: string
                required:
                - name
                type: object
              severity:
                description: |-
                  How serious the divergence is: `Low`, `Medium`, `High`, or `Critical`.
                  Drives alert routing rather than any automatic remediation.
                enum:
                - Low
                - Medium
                - High
                - Critical
                type: string
            required:
            - deviceId
            - machineConfigRef
            - severity
            type: object
          status:
            nullable: true
            properties:
              conditions:
                default: []
                items:
                  properties:
                    lastTransitionTime:
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              detectedAt:
                nullable: true
                type: string
              resolvedAt:
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: DriftAlert
        type: object
    served: true
    storage: true
    subresources:
      status: {}
