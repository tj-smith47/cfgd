apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: driftalerts.cfgd.io
spec:
  group: cfgd.io
  names:
    categories:
    - cfgd
    kind: DriftAlert
    plural: driftalerts
    shortNames:
    - da
    singular: driftalert
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.deviceId
      name: Device
      type: string
    - jsonPath: .spec.severity
      name: Severity
      type: string
    - jsonPath: .status.conditions[?(@.type=="Resolved")].status
      name: Resolved
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for DriftAlertSpec via `CustomResource`
        properties:
          spec:
            properties:
              deviceId:
                description: Identifier of the device that reported the drift, as it enrolled.
                type: string
              driftDetails:
                default: []
                description: |-
                  One entry per diverging field, each carrying what was expected and what
                  was found.
                items:
                  description: One diverging field in a drift report.
                  properties:
                    actual:
                      description: The value the device actually reported.
                      type: string
                    expected:
                      description: The value the MachineConfig declares.
                      type: string
                    field:
                      description: |-
                        Resource id of the field that diverged (e.g.
                        `system:sysctl.net.ipv4.ip_forward`).
                      type: string
                  required:
                  - actual
                  - expected
                  - field
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - field
                x-kubernetes-list-type: map
              machineConfigRef:
                description: The MachineConfig whose desired state the device diverged from.
                properties:
                  name:
                    description: Name of the referenced MachineConfig.
                    type: string
                  namespace:
                    description: |-
                      Namespace the MachineConfig lives in. Omitted, the referring
                      resource's own namespace is used.
                    nullable: true
                    type: string
                required:
                - name
                type: object
              severity:
                description: |-
                  How serious the divergence is: `Low`, `Medium`, `High`, or `Critical`.
                  Drives alert routing rather than any automatic remediation.
                enum:
                - Low
                - Medium
                - High
                - Critical
                type: string
            required:
            - deviceId
            - machineConfigRef
            - severity
            type: object
          status:
            nullable: true
            properties:
              conditions:
                default: []
                items:
                  properties:
                    lastTransitionTime:
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              detectedAt:
                nullable: true
                type: string
              resolvedAt:
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: DriftAlert
        type: object
    served: true
    storage: true
    subresources:
      status: {}
