# cfgd GitLab CI template
#
# Include in your .gitlab-ci.yml:
#
#   include:
#     - remote: https://raw.githubusercontent.com/tj-smith47/cfgd/master/ecosystem/gitlab/.cfgd-ci.yml
#
#   cfgd:apply:
#     extends: .cfgd-apply
#     variables:
#       CFGD_CONFIG_DIR: "."
#
# Or for dry-run only in merge requests:
#
#   cfgd:plan:
#     extends: .cfgd-plan
#     only:
#       - merge_requests

.cfgd-install: &cfgd_install
  - |
    if ! command -v cfgd &>/dev/null; then
      curl -fsSL https://github.com/tj-smith47/cfgd/releases/latest/download/install.sh | bash
    fi
    cfgd --version

.cfgd-plan:
  stage: test
  variables:
    CFGD_CONFIG_DIR: "."
    CFGD_ARGS: ""
  before_script:
    - *cfgd_install
  script:
    # The default config path is ~/.config/cfgd/cfgd.yaml; CI must point at the
    # checked-out repo explicitly or the plan silently reads the runner's HOME.
    # No pipes: a pipe would report the downstream command's exit code on
    # runners whose shell lacks pipefail, hiding a failed plan.
    - cfgd plan --no-color --config "$CFGD_CONFIG_DIR/cfgd.yaml" $CFGD_ARGS
    - cfgd plan --config "$CFGD_CONFIG_DIR/cfgd.yaml" --output json $CFGD_ARGS > cfgd-plan.json
  artifacts:
    paths:
      - cfgd-plan.json
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.cfgd-apply:
  stage: deploy
  variables:
    CFGD_CONFIG_DIR: "."
    CFGD_ARGS: ""
  before_script:
    - *cfgd_install
  script:
    - cfgd apply --yes --no-color --config "$CFGD_CONFIG_DIR/cfgd.yaml" $CFGD_ARGS
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
