[workspace]
resolver = "2"
members = [
    "crates/cfgd-schema",
    "crates/cfgd-crd",
    "crates/cfgd-core",
    "crates/cfgd",
    "crates/cfgd-operator",
    "crates/cfgd-csi",
    "crates/cfgd-test-fixtures",
]
# Every member but the `publish = false` ones. A root-level `cargo build` builds
# the default members, and resolver 2 unifies features across what it builds:
# with `cfgd-test-fixtures` among them, its `cfgd-core/test-helpers` dependency
# reaches every binary and swaps `$HOME` for a throwaway test home.
default-members = [
    "crates/cfgd-schema",
    "crates/cfgd-crd",
    "crates/cfgd-core",
    "crates/cfgd",
    "crates/cfgd-operator",
    "crates/cfgd-csi",
]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tj-smith47/cfgd"
homepage = "https://github.com/tj-smith47/cfgd"
authors = ["TJ Smith"]

# File:line backtraces survive; ~50 integration-test binaries shrink enough
# to fit ubuntu-latest's ~14 GB free disk. No coverage or test-integrity loss.
[profile.dev]
debug = "line-tables-only"

# The source walks parse every workspace file with `syn`; unoptimized, the
# parse costs the floored walk ~1.5x and the raw-read walk ~2x.
[profile.dev.package.syn]
opt-level = 3

[profile.dev.package.proc-macro2]
opt-level = 3
