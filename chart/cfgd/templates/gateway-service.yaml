{{- if and .Values.operator.enabled .Values.deviceGateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cfgd.fullname" . }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cfgd.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.deviceGateway.port }}
      targetPort: gateway
      protocol: TCP
      name: http-gateway
  # Only the lease holder carries the leader label, set once its gateway
  # accepts; standbys stay webhook endpoints without receiving gateway traffic.
  selector:
    {{- include "cfgd.operatorSelectorLabels" . | nindent 4 }}
    cfgd.io/gateway-leader: "true"
{{- end }}
