- kind: ClusterRole
  name: cfgd-e2e-42-csi
  selectors: []
- kind: ClusterRole
  name: cfgd-e2e-42-operator
  selectors: []
- kind: ClusterRoleBinding
  name: cfgd-e2e-42-csi
  selectors: []
- kind: ClusterRoleBinding
  name: cfgd-e2e-42-operator
  selectors: []
- kind: CSIDriver
  name: e2e.csi.cfgd.io
  selectors: []
- kind: MutatingWebhookConfiguration
  name: cfgd-e2e-42-pod-injector
  selectors:
    - name: inject-modules.cfgd.io
      objectSelector:
        matchExpressions:
          - key: cfgd.io/skip-injection
            operator: DoesNotExist
      namespaceSelector:
        matchExpressions:
          - key: cfgd.io/inject-modules
            operator: In
            values:
              - "true"
          - key: cfgd.io/e2e-run
            operator: In
            values:
              - "42"
- kind: ValidatingWebhookConfiguration
  name: cfgd-e2e-42
  selectors:
    - name: validate-machineconfig.cfgd.io
      objectSelector:
        matchLabels:
          cfgd.io/e2e-run: "42"
      namespaceSelector: null
    - name: validate-configpolicy.cfgd.io
      objectSelector:
        matchLabels:
          cfgd.io/e2e-run: "42"
      namespaceSelector: null
    - name: validate-clusterconfigpolicy.cfgd.io
      objectSelector:
        matchLabels:
          cfgd.io/e2e-run: "42"
      namespaceSelector: null
    - name: validate-driftalert.cfgd.io
      objectSelector:
        matchLabels:
          cfgd.io/e2e-run: "42"
      namespaceSelector: null
    - name: validate-module.cfgd.io
      objectSelector:
        matchLabels:
          cfgd.io/e2e-run: "42"
      namespaceSelector: null
    - name: validate-backuppolicy.cfgd.io
      objectSelector:
        matchLabels:
          cfgd.io/e2e-run: "42"
      namespaceSelector: null
- kind: DaemonSet
  name: cfgd-e2e-42-csi
  registrationPath:
    - "--kubelet-registration-path=/var/lib/kubelet/plugins/e2e.csi.cfgd.io/csi.sock"
  pluginHostPath:
    - /var/lib/kubelet/plugins/e2e.csi.cfgd.io/
- kind: DaemonSet
  name: cfgd-e2e-42-csi
  env:
    - container: cfgd-csi
      values:
        - name: CSI_DRIVER_NAME
          value: "e2e.csi.cfgd.io"
        - name: OCI_INSECURE_REGISTRIES
          value: registry.example:5000
        - name: DOCKER_CONFIG
          value: /etc/cfgd/docker
- kind: Deployment
  name: cfgd-e2e-42-operator
  env:
    - container: operator
      values:
        - name: CSI_DRIVER_NAME
          value: "e2e.csi.cfgd.io"
        - name: WATCH_LABEL_SELECTOR
          value: "cfgd.io/e2e-run=42"
        - name: OCI_INSECURE_REGISTRIES
          value: registry.example:5000
        - name: DOCKER_CONFIG
          value: /etc/cfgd/docker
- kind: DaemonSet
  name: cfgd-e2e-42-csi
  registryLogin:
    mounts:
      - container: cfgd-csi
        mountPath:
          - /etc/cfgd/docker
    secret:
      - registry-credentials
- kind: Deployment
  name: cfgd-e2e-42-operator
  registryLogin:
    mounts:
      - container: operator
        mountPath:
          - /etc/cfgd/docker
    secret:
      - registry-credentials
