apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: modules.cfgd.io
spec:
  group: cfgd.io
  names:
    categories:
    - cfgd
    kind: Module
    plural: modules
    shortNames:
    - mod
    singular: module
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.ociArtifact
      name: Artifact
      type: string
    - jsonPath: .status.signature
      name: Signature
      type: string
    - jsonPath: .status.platformsSummary
      name: Platforms
      type: string
    - jsonPath: .status.conditions[?(@.type=="Available")].status
      name: Available
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for ModuleSpec via `CustomResource`
        properties:
          spec:
            properties:
              depends:
                default: []
                description: Names of other `Module` resources that must be applied first.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              env:
                default: []
                description: |-
                  Environment variables this module contributes to containers that mount
                  it.
                items:
                  description: An environment variable set by a Module.
                  properties:
                    append:
                      default: false
                      description: |-
                        Append to the variable's existing value with the platform's path
                        separator instead of replacing it. Default: `false`.
                      type: boolean
                    name:
                      description: Variable name, as exported into the container or shell environment.
                      type: string
                    platforms:
                      description: |-
                        Platform tags gating this entry alone. Empty means every platform the
                        declaring module is not already gated off of. Tags are matched against
                        the machine's OS, distro, and arch; use `macos` for macOS. A pod is a
                        Linux container, so the pod-mutating webhook injects an entry only when
                        this is empty or names `linux` — nothing about a pod can answer a
                        distro or arch tag.
                      items:
                        type: string
                      type: array
                    value:
                      description: Value assigned to the variable.
                      type: string
                  required:
                  - name
                  - value
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              files:
                default: []
                description: Files this module deploys out of its artifact.
                items:
                  description: A file managed by a Module.
                  properties:
                    source:
                      description: Path to the file inside the module artifact.
                      type: string
                    target:
                      description: |-
                        Destination path the file is deployed to inside the pod or on the
                        machine.
                      type: string
                  required:
                  - source
                  - target
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - source
                x-kubernetes-list-type: map
              mountPolicy:
                default: Always
                description: |-
                  Controls how the module is mounted in pods.
                  `Always` (default): CSI volume + volumeMount on all declared containers + env vars.
                  `Debug`: CSI volume only — no volumeMount or env on declared containers.
                    Only accessible via ephemeral debug containers (`kubectl cfgd debug`).
                enum:
                - Always
                - Debug
                type: string
              ociArtifact:
                description: |-
                  OCI reference the module's content is pulled from
                  (`ghcr.io/acme/nvim:1.2.0`). Omitted, the module carries its content
                  inline and nothing is fetched.
                nullable: true
                type: string
              packages:
                default: []
                description: |-
                  Packages this module installs, each with optional per-platform name
                  overrides.
                items:
                  description: An entry in a Module's package list with optional per-platform overrides.
                  properties:
                    name:
                      description: Default package name, used on every platform with no override below.
                      type: string
                    platforms:
                      additionalProperties:
                        type: string
                      description: 'Per-platform package name overrides (e.g. {"brew": "gnu-sed", "apt": "sed"}).'
                      type: object
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              scripts:
                default: {}
                description: Lifecycle commands run around the module's deployment.
                properties:
                  postApply:
                    description: |-
                      Command run once after the module's files and packages are in place.
                      Omitted, nothing runs.
                    nullable: true
                    type: string
                type: object
              signature:
                description: |-
                  How the artifact's provenance is verified before it is admitted.
                  Omitted, verification is governed by the cluster policy alone.
                nullable: true
                properties:
                  cosign:
                    description: |-
                      How the artifact's cosign signature is verified. Omitted, no signature
                      is required of this module.
                    nullable: true
                    properties:
                      certificateIdentity:
                        description: Certificate identity pattern for keyless verification (regex).
                        nullable: true
                        type: string
                      certificateOidcIssuer:
                        description: Certificate OIDC issuer pattern for keyless verification (regex).
                        nullable: true
                        type: string
                      keyless:
                        default: false
                        description: Enable keyless verification via Fulcio/Rekor (OIDC identity-based).
                        type: boolean
                      publicKey:
                        description: PEM-encoded public key for static key verification.
                        nullable: true
                        type: string
                    type: object
                type: object
            type: object
          status:
            nullable: true
            properties:
              attestations:
                description: Attestation types found on the artifact (e.g. "slsaprovenance1").
                items:
                  type: string
                type: array
              availablePlatforms:
                default: []
                items:
                  type: string
                type: array
              conditions:
                default: []
                items:
                  properties:
                    lastTransitionTime:
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  The `metadata.generation` every other field here was computed from. A
                  status whose `observedGeneration` is behind `metadata.generation`
                  describes the PREVIOUS spec, which is what lets a caller wait for a
                  verdict about the spec it just applied instead of reading the one it
                  replaced.
                format: int64
                nullable: true
                type: integer
              platformsSummary:
                description: |-
                  `availablePlatforms` rendered as one comma-joined string for the
                  `Platforms` printer column, and the only field that column may be bound
                  to: a column resolving to an array prints the Go rendering of the
                  slice, so an empty one reads as the literal `[]` where an absent value
                  leaves the cell empty. Absent when no platform is known, so the
                  JSONPath resolves to nothing and the cell stays blank.
                nullable: true
                type: string
              resolvedArtifact:
                nullable: true
                type: string
              signature:
                description: |-
                  The signature verdict as ONE word (`verified` / `unverified` /
                  `unsigned` / `unknown`), and the only field the `Signature` printer
                  column may be bound to. `verified` is the same verdict as a raw bool,
                  which reads as
                  `true` in a column beside a `kubectl cfgd status` row saying
                  `(verified)` about the same module — one fact, two vocabularies. Absent
                  when no reconcile has written it, so the JSONPath resolves to nothing
                  and the cell stays blank.
                nullable: true
                type: string
              signatureDigest:
                description: Digest of the cosign signature (if verified).
                nullable: true
                type: string
              verified:
                default: false
                type: boolean
            type: object
        required:
        - spec
        title: Module
        type: object
    served: true
    storage: true
    subresources:
      status: {}
