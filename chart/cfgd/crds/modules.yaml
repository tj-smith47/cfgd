apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: modules.cfgd.io
spec:
  group: cfgd.io
  names:
    categories:
    - cfgd
    kind: Module
    plural: modules
    shortNames:
    - mod
    singular: module
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.ociArtifact
      name: Artifact
      type: string
    - jsonPath: .status.verified
      name: Verified
      type: boolean
    - jsonPath: .status.availablePlatforms
      name: Platforms
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for ModuleSpec via `CustomResource`
        properties:
          spec:
            properties:
              depends:
                default: []
                description: Names of other `Module` resources that must be applied first.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              env:
                default: []
                description: |-
                  Environment variables this module contributes to containers that mount
                  it.
                items:
                  description: An environment variable set by a Module.
                  properties:
                    append:
                      default: false
                      description: |-
                        Append to the variable's existing value with the platform's path
                        separator instead of replacing it. Default: `false`.
                      type: boolean
                    name:
                      description: Variable name, as exported into the container or shell environment.
                      type: string
                    value:
                      description: Value assigned to the variable.
                      type: string
                  required:
                  - name
                  - value
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              files:
                default: []
                description: Files this module deploys out of its artifact.
                items:
                  description: A file managed by a Module.
                  properties:
                    source:
                      description: Path to the file inside the module artifact.
                      type: string
                    target:
                      description: |-
                        Destination path the file is deployed to inside the pod or on the
                        machine.
                      type: string
                  required:
                  - source
                  - target
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - source
                x-kubernetes-list-type: map
              mountPolicy:
                default: Always
                description: |-
                  Controls how the module is mounted in pods.
                  `Always` (default): CSI volume + volumeMount on all declared containers + env vars.
                  `Debug`: CSI volume only — no volumeMount or env on declared containers.
                    Only accessible via ephemeral debug containers (`kubectl cfgd debug`).
                enum:
                - Always
                - Debug
                type: string
              ociArtifact:
                description: |-
                  OCI reference the module's content is pulled from
                  (`ghcr.io/acme/nvim:1.2.0`). Omitted, the module carries its content
                  inline and nothing is fetched.
                nullable: true
                type: string
              packages:
                default: []
                description: |-
                  Packages this module installs, each with optional per-platform name
                  overrides.
                items:
                  description: An entry in a Module's package list with optional per-platform overrides.
                  properties:
                    name:
                      description: Default package name, used on every platform with no override below.
                      type: string
                    platforms:
                      additionalProperties:
                        type: string
                      description: 'Per-platform package name overrides (e.g. {"brew": "gnu-sed", "apt": "sed"}).'
                      type: object
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              scripts:
                default: {}
                description: Lifecycle commands run around the module's deployment.
                properties:
                  postApply:
                    description: |-
                      Command run once after the module's files and packages are in place.
                      Omitted, nothing runs.
                    nullable: true
                    type: string
                type: object
              signature:
                description: |-
                  How the artifact's provenance is verified before it is admitted.
                  Omitted, verification is governed by the cluster policy alone.
                nullable: true
                properties:
                  cosign:
                    description: |-
                      How the artifact's cosign signature is verified. Omitted, no signature
                      is required of this module.
                    nullable: true
                    properties:
                      certificateIdentity:
                        description: Certificate identity pattern for keyless verification (regex).
                        nullable: true
                        type: string
                      certificateOidcIssuer:
                        description: Certificate OIDC issuer pattern for keyless verification (regex).
                        nullable: true
                        type: string
                      keyless:
                        default: false
                        description: Enable keyless verification via Fulcio/Rekor (OIDC identity-based).
                        type: boolean
                      publicKey:
                        description: PEM-encoded public key for static key verification.
                        nullable: true
                        type: string
                    type: object
                type: object
            type: object
          status:
            nullable: true
            properties:
              attestations:
                description: Attestation types found on the artifact (e.g. "slsaprovenance1").
                items:
                  type: string
                type: array
              availablePlatforms:
                default: []
                items:
                  type: string
                type: array
              conditions:
                default: []
                items:
                  properties:
                    lastTransitionTime:
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              resolvedArtifact:
                nullable: true
                type: string
              signatureDigest:
                description: Digest of the cosign signature (if verified).
                nullable: true
                type: string
              verified:
                default: false
                type: boolean
            type: object
        required:
        - spec
        title: Module
        type: object
    served: true
    storage: true
    subresources:
      status: {}
