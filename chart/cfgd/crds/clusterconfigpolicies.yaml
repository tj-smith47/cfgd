apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusterconfigpolicies.cfgd.io
spec:
  group: cfgd.io
  names:
    categories:
    - cfgd
    kind: ClusterConfigPolicy
    plural: clusterconfigpolicies
    shortNames:
    - ccpol
    singular: clusterconfigpolicy
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.compliantCount
      name: Compliant
      type: integer
    - jsonPath: .status.nonCompliantCount
      name: NonCompliant
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Enforced")].status
      name: Enforced
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for ClusterConfigPolicySpec via `CustomResource`
        properties:
          spec:
            properties:
              debugModules:
                default: []
                description: Modules staged as debug-only across matching namespaces.
                items:
                  description: Reference to a module that should be installed on the machine.
                  properties:
                    name:
                      description: Name of the cluster-scoped `Module` resource to install.
                      type: string
                    required:
                      default: false
                      description: |-
                        Whether a failure to resolve or install this module fails the whole
                        reconcile. Default: `false`, so a missing module is reported and the
                        rest of the machine still converges.
                      type: boolean
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              namespaceSelector:
                default:
                  matchExpressions: []
                  matchLabels: {}
                description: |-
                  Select which namespaces this cluster policy applies to. Empty, it
                  applies to every namespace in the cluster.
                properties:
                  matchExpressions:
                    default: []
                    description: |-
                      Set-based requirements a resource must satisfy, evaluated alongside
                      `matchLabels`. Every requirement must hold.
                    items:
                      description: A single requirement for label selector expressions.
                      properties:
                        key:
                          description: Label key this requirement tests.
                          type: string
                        operator:
                          description: |-
                            How `values` is compared against the key: `In`, `NotIn`, `Exists`, or
                            `DoesNotExist`.
                          enum:
                          - In
                          - NotIn
                          - Exists
                          - DoesNotExist
                          type: string
                        values:
                          default: []
                          description: |-
                            Values the key is tested against. Required for `In` and `NotIn`, and
                            must be empty for `Exists` and `DoesNotExist`.
                          items:
                            type: string
                          type: array
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - key
                    x-kubernetes-list-type: map
                  matchLabels:
                    additionalProperties:
                      type: string
                    default: {}
                    description: |-
                      Labels a resource must carry verbatim to match. Every entry must match;
                      an empty map matches everything.
                    type: object
                type: object
              packages:
                default: []
                description: Packages every MachineConfig in a selected namespace must declare.
                items:
                  description: Reference to a package with optional version pin.
                  properties:
                    name:
                      description: Package name as the machine's own package manager knows it.
                      type: string
                    version:
                      description: |-
                        Exact version to pin to. Omitted, whatever the manager currently offers
                        is installed and left alone once present.
                      nullable: true
                      type: string
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              requiredModules:
                default: []
                description: Modules every MachineConfig in a selected namespace must carry.
                items:
                  description: Reference to a module that should be installed on the machine.
                  properties:
                    name:
                      description: Name of the cluster-scoped `Module` resource to install.
                      type: string
                    required:
                      default: false
                      description: |-
                        Whether a failure to resolve or install this module fails the whole
                        reconcile. Default: `false`, so a missing module is reported and the
                        rest of the machine still converges.
                      type: boolean
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              security:
                default:
                  allowUnsigned: false
                  trustedRegistries: []
                description: Cluster-wide rules governing which modules may be admitted at all.
                properties:
                  allowUnsigned:
                    default: false
                    description: |-
                      Whether a module carrying an unsigned OCI artifact may be admitted.
                      Default: `false` — creating any ClusterConfigPolicy at all starts
                      rejecting unsigned modules.
                    type: boolean
                  trustedRegistries:
                    default: []
                    description: |-
                      Registry prefixes a module artifact may be pulled from; a trailing `*`
                      or `/` widens the match. Empty, any registry is accepted.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                type: object
              settings:
                additionalProperties: true
                default: {}
                description: |-
                  System settings every MachineConfig in a selected namespace must
                  declare, keyed the same way as `MachineConfig.spec.systemSettings`.
                type: object
            type: object
          status:
            nullable: true
            properties:
              compliantCount:
                format: uint32
                minimum: 0.0
                type: integer
              conditions:
                default: []
                items:
                  properties:
                    lastTransitionTime:
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      nullable: true
                      type: integer
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              nonCompliantCount:
                format: uint32
                minimum: 0.0
                type: integer
              nonCompliantMachines:
                default: []
                description: |-
                  `namespace/name` of the MachineConfigs currently violating this policy,
                  sorted and capped at [`MAX_NON_COMPLIANT_MACHINES`]. Persisted so a
                  `PolicyViolation` event fires on the transition into violation rather
                  than once per observation — an in-process memory would re-announce every
                  machine after an operator restart. `nonCompliantCount` is the exact
                  total and is never capped.
                items:
                  type: string
                maxItems: 500
                type: array
            required:
            - compliantCount
            - nonCompliantCount
            type: object
        required:
        - spec
        title: ClusterConfigPolicy
        type: object
    served: true
    storage: true
    subresources:
      status: {}
