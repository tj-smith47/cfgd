agent: {enabled: false}
deviceGateway: {enabled: false}
podDisruptionBudget: {enabled: false}
networkPolicy: {enabled: false}
metrics: {serviceMonitor: {enabled: false}}
webhook: {failurePolicy: Fail}
mutatingWebhook: {failurePolicy: Fail}
# Other jobs of the run apply through this install's webhook while OP-LC-03
# deletes the leader; the standby keeps the webhook Service an endpoint.
operator:
  replicaCount: 2
  image: {pullPolicy: Always}
  imagePullSecrets: [{name: registry-credentials}]
  extraVolumes:
    - name: docker-config
      secret: {secretName: registry-credentials, items: [{key: .dockerconfigjson, path: config.json}]}
  extraVolumeMounts:
    - {name: docker-config, mountPath: /etc/cfgd/docker, readOnly: true}
  extraEnv:
    - {name: DOCKER_CONFIG, value: /etc/cfgd/docker}
csiDriver:
  enabled: true
  image: {pullPolicy: Always}
  imagePullSecrets: [{name: registry-credentials}]
  extraVolumes:
    - name: docker-config
      secret: {secretName: registry-credentials, items: [{key: .dockerconfigjson, path: config.json}]}
  extraVolumeMounts:
    - {name: docker-config, mountPath: /etc/cfgd/docker, readOnly: true}
  extraEnv:
    - {name: DOCKER_CONFIG, value: /etc/cfgd/docker}
