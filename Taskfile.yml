version: "3"

dotenv: [".env"]

vars:
  REGISTRY:
    sh: echo "${REGISTRY:-registry.jarvispro.io}"
  TARGET_MAXSIZE:
    sh: echo "${CFGD_TARGET_MAXSIZE:-20GB}"
  # The one spelling of the rustdoc gate's deny-warnings flag. ci.yml gets it
  # by invoking `task doc` and never repeats the string.
  RUSTDOC_DENY_WARNINGS: "-D warnings"
  # cargo-llvm-cov leaves every `tests/` directory out of its report.
  # `cfgd-test-fixtures` is the code `crates/cfgd/tests/` shares, so the filter
  # leaves it out too and the report measures the shipped crates alone.
  LLVM_COV_IGNORE: "--ignore-filename-regex crates/cfgd-test-fixtures/"

env:
  REGISTRY: '{{.REGISTRY}}'

# Artifact-identity vars (version/os/arch) shared by the docker, image-push, and
# release-archive tasks. Defined as a per-task `vars:` anchor; global
# `env:`/`vars:` would not work, because Task evaluates global blocks eagerly for EVERY invocation:
# the `grep`/`uname` shells aborted `task test:ci` on the Windows CI runner, which
# never builds artifacts. Per-task `vars:` are evaluated lazily, only when one of
# these Linux-only packaging tasks actually runs.
x-artifact-vars: &artifact-vars
  # The CLI binary version comes from its own crate manifest. `git describe --tags`
  # would not do: it returns the newest monorepo tag (e.g. cfgd-core's `core-v0.4.0`), which
  # mis-names every artifact and diverges from the published `cfgd-<version>-linux-amd64`.
  VERSION:
    sh: grep -m1 '^version' crates/cfgd/Cargo.toml | sed 's/.*"\(.*\)".*/\1/'
  VERSION_NUM:
    sh: echo "{{.VERSION}}" | sed 's/^v//'
  OS:
    sh: uname -s | tr '[:upper:]' '[:lower:]'
  # Go-arch naming to match the published release assets (anodizer maps x86_64->amd64,
  # aarch64->arm64); uname's `x86_64` would 404 against `cfgd-<v>-linux-amd64.tar.gz`.
  ARCH:
    sh: |
      ARCH=$(uname -m)
      case "$ARCH" in x86_64|amd64) echo "amd64" ;; arm64|aarch64) echo "arm64" ;; *) echo "$ARCH" ;; esac

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  _check:tmp-headroom:
    internal: true
    desc: "Precondition: when /tmp is tmpfs, require it under 50% full, as tmpfs pressure OOMs the cargo linker."
    preconditions:
      # The pressure scenario only applies when /tmp is backed by tmpfs
      # (Claude sandbox host). macOS, Windows, and GitHub Actions runners
      # all back /tmp with real disk; on those the linker can't OOM from
      # /tmp pressure, so skip the check entirely.
      - sh: '[ "$(uname)" != "Linux" ] || [ "$(stat -f -c %T /tmp 2>/dev/null)" != "tmpfs" ] || [ "$(df --output=pcent /tmp | tail -1 | tr -dc 0-9)" -lt 50 ]'
        msg: "/tmp is over 50% full, so cargo will OOM under tmpfs RAM pressure. Run `du -sh /tmp/*/ | sort -hr | head` to find offenders and clean them. Write all scratch / debug / download files to `/opt/repos/.det-debug/` or `~/.cache/`, NEVER `/tmp`."

  _check:mem-headroom:
    internal: true
    desc: "Precondition: rustdoc over this workspace peaks near 10 GB; refuse to start it with less available, so it fails here before the kernel can kill whatever else is largest."
    preconditions:
      # MemAvailable is in kB; 10 GB = 10485760 kB. Only Linux exposes /proc/meminfo;
      # the macOS and Windows runners are never short of it for this step.
      - sh: '[ "$(uname)" != "Linux" ] || [ "$(grep MemAvailable /proc/meminfo | tr -dc 0-9)" -ge 10485760 ]'
        msg: "Under 10 GB of memory available: rustdoc for this workspace peaks near 10 GB and the kernel OOM-kills the largest process on the host. `task doc` is CI's gate and `task push`'s; run it there, or free the memory first."

  # --- Build ---

  build:
    desc: Build all binaries in release mode
    deps: [_check:tmp-headroom]
    sources:
      - "crates/**/src/**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"
    generates:
      - "target/release/cfgd"
    cmds:
      - cargo build --release

  build:dev:
    desc: Build all binaries in debug mode
    deps: [_check:tmp-headroom]
    cmds:
      - cargo build

  install:
    desc: Install cfgd binary to cargo bin
    deps: [_check:tmp-headroom]
    cmds:
      - cargo install --path crates/cfgd

  # --- Quality ---

  check:
    desc: Run all quality checks (fmt:check, clippy, test, audit, shellcheck); the rustdoc gate runs in CI and ahead of `task push`
    cmds:
      - task: fmt:check
      - task: clippy
      - task: test
      - task: audit
      - task: shellcheck

  fmt:
    desc: Format code
    cmds:
      - cargo fmt

  fmt:check:
    desc: Check code formatting (CI)
    cmds:
      - cargo fmt --check

  clippy:
    desc: Run clippy linter
    deps: [_check:tmp-headroom]
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  doc:
    desc: "CI's rustdoc gate: build the workspace docs denying every rustdoc lint (broken intra-doc links, bare URLs, unclosed HTML tags, ...). `--document-private-items` renders private items but does not exempt them from `rustdoc::private_intra_doc_links`, which `-D warnings` denies: a `pub` item's doc comment naming a private one in brackets fails here. No local chain but `task push` runs it; it refuses to start with under 10 GB of memory available."
    deps: [_check:tmp-headroom, _check:mem-headroom]
    env:
      RUSTDOCFLAGS: '{{.RUSTDOC_DENY_WARNINGS}}'
      # The cfgd and cfgd-operator rustdocs each peak near 10 GB; two in flight on a
      # 12 GB host is an OOM kill, so this step alone runs one crate at a time.
      CARGO_BUILD_JOBS: 1
    cmds:
      - cargo doc --workspace --no-deps --document-private-items --all-features

  test:
    desc: Run all tests. Pass `-- <args>` to forward to cargo test.
    deps: [_check:tmp-headroom]
    cmds:
      - cargo nextest run --workspace --no-fail-fast {{.CLI_ARGS}}

  test:ci:
    desc: CI test entrypoint. Scopes Windows and FreeBSD to cfgd-core+cfgd (operator/csi covered by E2E / have no FreeBSD surface).
    cmds:
      - cmd: |
          if [ "${RUNNER_OS:-}" = "Windows" ]; then
            export OPENSSL_DIR='C:/Program Files/OpenSSL'
            cargo nextest run --no-fail-fast -p cfgd-core -p cfgd {{.CLI_ARGS}}
          elif [ "$(uname -s)" = "FreeBSD" ]; then
            # No RUNNER_OS inside the vmactions guest; discriminate on uname.
            # cfgd-operator (kube) and cfgd-csi (CSI, a Linux kubelet plugin)
            # carry no FreeBSD surface, so the FreeBSD leg mirrors Windows.
            cargo nextest run --no-fail-fast -p cfgd-core -p cfgd {{.CLI_ARGS}}
          else
            cargo nextest run --workspace --no-fail-fast {{.CLI_ARGS}}
          fi

  test:freebsd:
    desc: "Run the FreeBSD leg locally: ensure the accept VM is up (start + poll if not), sync the tree, and run `task test:ci` on it. Rig overridable via FREEBSD_VM_* env; SHUTDOWN=1 powers the VM off after."
    vars:
      # Maintainer rig defaults; override via env for a different host/VM.
      HOST: '{{.FREEBSD_VM_HOST | default "fbsd"}}'
      VMID: '{{.FREEBSD_VM_ID | default "105"}}'
      PVE: '{{.FREEBSD_VM_PVE | default "sir"}}'
    cmds:
      - cmd: |
          set -e
          # qm lives on the Proxmox host; ensure the guest is running before use.
          if [ "$(ssh {{.PVE}} qm status {{.VMID}} | awk '{print $2}')" != "running" ]; then
            echo "==> starting FreeBSD VM {{.VMID}} on {{.PVE}}"
            ssh {{.PVE}} qm start {{.VMID}}
          fi
          echo "==> waiting for {{.HOST}} sshd"
          i=0
          until ssh -o ConnectTimeout=8 {{.HOST}} true 2>/dev/null; do
            i=$((i + 1))
            [ "$i" -ge 30 ] && { echo "{{.HOST}} did not become reachable" >&2; exit 1; }
            sleep 4
          done
          # Provision the toolchain only when absent: a warm VM skips straight
          # to the test run. rustup (not pkg rust) guarantees >= MSRV.
          ssh {{.HOST}} 'command -v cargo >/dev/null 2>&1 || { pkg install -y rustup-init && rustup-init -y --default-toolchain stable --profile minimal; }'
          ssh {{.HOST}} 'command -v task >/dev/null 2>&1 || pkg install -y task'
          ssh {{.HOST}} 'test -x "$HOME/.cargo/bin/cargo-nextest" || command -v cargo-nextest >/dev/null 2>&1 || pkg install -y nextest'
          # openssl is a vendored dependency (portable binary), so openssl-sys
          # builds OpenSSL from source, which needs gmake + perl, neither in the
          # FreeBSD base. Mirror ci.yml's freebsd prepare so a fresh VM links it.
          ssh {{.HOST}} 'command -v gmake >/dev/null 2>&1 || pkg install -y gmake'
          ssh {{.HOST}} 'command -v perl >/dev/null 2>&1 || pkg install -y perl5'
          # Mirror ci.yml's freebsd prepare for the demo-script tests: they run
          # the real bash scripts, and the demo pin runs `git ls-files` on the
          # synced tree, so bash, git and the tree's .git all have to be there.
          ssh {{.HOST}} 'command -v bash >/dev/null 2>&1 || pkg install -y bash'
          ssh {{.HOST}} 'command -v git >/dev/null 2>&1 || pkg install -y git'
          ssh {{.HOST}} "git config --global --get-all safe.directory | grep -qxF '*' || git config --global --add safe.directory '*'"
          echo "==> syncing tree to {{.HOST}}:cfgd"
          rsync -a --delete --exclude target --exclude '*.log' ./ {{.HOST}}:cfgd/
          echo "==> task test:ci on {{.HOST}}"
          ssh {{.HOST}} '. "$HOME/.cargo/env"; cd cfgd && task test:ci && task installer:test'
          if [ -n "{{.SHUTDOWN}}" ]; then
            echo "==> powering off FreeBSD VM {{.VMID}}"
            ssh {{.HOST}} 'shutdown -p now' || true
          fi

  test:freebsd:npm-prefix:
    desc: "Real-host proof of the unprivileged npm global-prefix fallback (FreeBSD only, needs root). BIN overrides the cfgd binary under test."
    vars:
      BIN: '{{.BIN | default "target/debug/cfgd"}}'
    cmds:
      - cmd: |
          # No RUNNER_OS inside the vmactions guest, so discriminate on uname
          # like `test:ci` does. Every other host has a writable npm prefix or
          # no `www/npm` at all, so there is nothing for the check to observe.
          if [ "$(uname -s)" != "FreeBSD" ]; then
            echo "==> skipping test:freebsd:npm-prefix: FreeBSD only (uname -s is $(uname -s))"
            exit 0
          fi
          sh tests/real-host/freebsd-npm-prefix.sh '{{.BIN}}'

  test:threads:
    desc: "Thread-model leg: plain `cargo test` (not nextest) at a high thread count, run by `task ci` and CI's dedicated ubuntu-only job."
    deps: [_check:tmp-headroom]
    cmds:
      # nextest runs one process per test, so every test gets its own copy of
      # `environ` and every `static`, so it structurally cannot observe a race
      # on process-global state shared across tests (PATH mutation raced
      # against command_path resolution, the `console` crate's global colour
      # flags, env vars like CFGD_CACHE_DIR). Plain `cargo test` runs tests as
      # threads inside one process, so it can; --test-threads=16 forces
      # enough interleaving to make that class reproducible.
      - cargo test --workspace --all-features -- --test-threads=16

  test:crate:*:
    desc: 'Run tests for one crate: `task test:crate:<crate> -- <filter>`'
    deps: [_check:tmp-headroom]
    vars:
      CRATE: '{{index .MATCH 0}}'
    cmds:
      - |
        # cfgd-crd and cfgd-schema depend on no other cfgd crate, so naming
        # cfgd-core's feature while testing one of them makes cargo error out,
        # and neither needs a binary cfgd-core builds. The question is
        # asked of the manifest, which is what decides whether the feature path
        # resolves at all.
        if [ "{{.CRATE}}" = cfgd-core ] || grep -qE \
            '^[[:space:]]*cfgd-core[[:space:]]*=|^\[(dev-|build-)?dependencies\.cfgd-core\]' \
            crates/{{.CRATE}}/Cargo.toml; then
          # Plain `cargo test -p <crate>` never builds cfgd-core's fake-cosign
          # shim binary (nextest targets do it implicitly); cosign tests need it.
          # The shim declares required-features = test-helpers, and `--bins`
          # silently SKIPS bins with unmet required-features, so the feature
          # flag is what makes this line produce the shim at all.
          cargo build -p cfgd-core --bins --features cfgd-core/test-helpers
          cargo test -p {{.CRATE}} --features cfgd-core/test-helpers {{.CLI_ARGS}}
        else
          cargo test -p {{.CRATE}} {{.CLI_ARGS}}
        fi

  audit:
    desc: Run project-specific code quality audit
    cmds:
      - bash .claude/scripts/audit.sh

  shellcheck:
    desc: Run shellcheck over every tracked shell script (`git ls-files '*.sh'`) with the repo's .shellcheckrc, refusing any version but the one pinned in .github/actions/setup-shellcheck/action.yml.
    cmds:
      - task: _shellcheck:pin
      - |
        n=$(git ls-files '*.sh' | wc -l | tr -d ' ')
        # An empty population would pass on zero files, so a broken pathspec fails here.
        if [ "$n" -eq 0 ]; then
          echo "shellcheck: git ls-files '*.sh' matched no tracked script" >&2
          exit 1
        fi
        git ls-files -z '*.sh' | xargs -0 shellcheck
        echo "shellcheck $(shellcheck --version | sed -n 's/^version: //p'): $n scripts clean"

  installer:shellcheck:
    desc: Run shellcheck as POSIX sh over the installer `task snapshot` renders from scripts/install.sh.tpl (dist/install.sh), refusing any version but the pinned one.
    preconditions:
      - sh: test -f dist/install.sh
        msg: "dist/install.sh is missing; run `task snapshot` first, which renders it from scripts/install.sh.tpl."
    cmds:
      - task: _shellcheck:pin
      # The template is not shell until rendered; the installer runs under dash, ash and FreeBSD sh.
      - shellcheck --shell=sh dist/install.sh
      - |
        echo "shellcheck $(shellcheck --version | sed -n 's/^version: //p') (sh): dist/install.sh clean"

  _shellcheck:pin:
    internal: true
    run: once
    desc: "Internal: fail unless the shellcheck on PATH is the version CI installs; another version reports a different set of findings."
    vars:
      PIN_FILE: .github/actions/setup-shellcheck/action.yml
    preconditions:
      - sh: command -v shellcheck
        msg: "shellcheck is not installed; install the version pinned in {{.PIN_FILE}}."
    cmds:
      - |
        pin=$(awk '/^  version:/ { inside = 1; next } inside && /^  [^ ]/ { exit } inside && /default:/ { split($0, q, "\""); print q[2]; exit }' {{.PIN_FILE}})
        if [ -z "$pin" ]; then
          echo "shellcheck: no version default found under version: in {{.PIN_FILE}}" >&2
          exit 1
        fi
        have="v$(shellcheck --version | sed -n 's/^version: //p')"
        if [ "$have" != "$pin" ]; then
          echo "shellcheck: $have is on PATH, and {{.PIN_FILE}} pins $pin; install $pin" >&2
          exit 1
        fi

  version-files:check:
    desc: Verify every file enrolled in .anodizer.yaml version_files still carries its crate's current version (CI drift guard).
    cmds:
      # A release that fails after `anodizer tag` never lands its bump on master, and the
      # next old->new sweep then finds nothing to replace, so the literal freezes forever
      # (v0.8.0 left the chart and four docs at 0.7.0). This check catches it before a user does.
      - '${ANODIZER_BIN:-anodizer} check version-files'

  chart:test:
    desc: Render the chart per case and compare the operator Deployment's update strategy and readiness probe, and the cluster-scoped objects, CSI plugin paths and CSI/watch env, with chart/cfgd/tests/golden (UPDATE=1 rewrites the goldens).
    cmds:
      - bash chart/cfgd/tests/render.sh

  installer:test:
    desc: Run the installer's install-directory checks (scripts/tests/test-install-dir.sh) against scratch directories; no download, no root.
    cmds:
      - sh scripts/tests/test-install-dir.sh

  e2e:tags:check:
    desc: Verify the e2e image tag map resolves each image to IMAGE_TAG or its own override, that port_forward waits for its tunnel and keeps kubectl's output, that the counter readers read only the `<family>_total` sample spelling, that no e2e script composes an image reference, starts a port-forward or matches a counter sample outside common/helpers.sh, that no e2e case calls pass_test after printing an excuse, that helpers.sh names the PR install, its run id and its CSI driver, that heredocs.awk reads each heredoc shape, and that every object of a kind schemas/crds.yaml declares that any tests/e2e/*/scripts suite applies carries the run label, each reaching the cluster only from a heredoc on the apply command itself, and that the CRD check setup runs passes on CRDs whose spec matches the cluster's, descriptions and API server defaults aside, and stops on a changed spec or a CRD that is missing, unreadable or not Established, that argocd_managed and the Crossplane install tell a tracked, untracked and unreadable object apart, that no e2e script writes a CRD outside its exempt list and no tracked manifest under tests/e2e holds one, that the Crossplane suite's XRD check passes on a matching XRD and stops on a changed, missing, unreadable or not Established one, that the run's Composition renders with only its name, Function and run label changed and the render stops on a line missing or doubled, that every TeamConfig carries the run label and names the run's Composition, that no tracked manifest under tests/e2e holds a TeamConfig, and that no e2e script applies manifests/crossplane, writes the XRD, Composition, Function or runtime config ArgoCD owns on a kubectl line or in a heredoc, or names a :latest function package, and that every full-stack Helm install and upgrade passes HELM_SCOPE, which scopes its operator, validating webhook and pod injector to its own namespace's label, an array of exactly its three flags that no line appends to or rewrites, and overrides none of its keys, and that pr-install-down.sh deletes the run's objects of every kind schemas/crds.yaml and the TeamConfig XRD declare, the run's Composition and Function (and fails when either is still there after), the Helm release and its namespace in that order, runs every step after one fails before exiting 1, and treats a release that is not installed as removed, and that every sleep in an e2e script is the poll interval of a deadline loop in common/helpers.sh, the run_every cadence there or carries a sleep-ok hatch, with the cadence listed and each hatch printed with its reason (no cluster needed; kubectl, jq and mikefarah yq v4 on PATH).
    cmds:
      - bash tests/e2e/common/test-image-tags.sh
      - bash tests/e2e/common/test-port-forward.sh
      - bash tests/e2e/common/test-metrics.sh
      - bash tests/e2e/common/test-verdicts.sh
      - bash tests/e2e/common/test-pr-install.sh
      - bash tests/e2e/common/test-waits.sh

  chart:tags:check:
    desc: Verify every first-party image the chart renders by default names the version its crate has released, or the one the release cut from this commit publishes (CI drift guard).
    cmds:
      # The chart's three components version independently (agent = appVersion,
      # operator/csi = their own crate versions). All three pins are swept by
      # anodizer's version_files at tag time, so each must name its crate's
      # current version. Each pin is asked of ghcr, with two exceptions for a
      # pin the release cut from THIS commit publishes, since that release is
      # still building when CI runs: the release has yet to be tagged
      # (`anodizer tag --dry-run` predicts the pin), or it was tagged within
      # the last two hours (the crate's own release tag exists and its tagged
      # commit is that recent: anodizer's bump commit itself, or a commit pushed
      # while that release still builds). The bound keeps the tag arm from
      # answering every later run, where the pin, the crate version and the
      # tag agree by construction and only ghcr can say whether the image was
      # ever pushed. `git tag -l` reads local tags, which `git fetch` never
      # prunes, so a local run inside the window can pass a tag a rollback
      # deleted on origin; CI clones fresh. The `hand` branch below is for a
      # pin no crate enrolls: on a release branch it must already name the
      # predicted version, and off one it may run ahead of the released
      # version, which the release branch's own run then checks exactly.
      - cmd: |
          set -e
          predicted=$(${ANODIZER_BIN:-anodizer} tag --dry-run 2>/dev/null | sed -n 's/^anodizer-output versions=//p')
          current=$(for f in crates/*/Cargo.toml; do yq -p toml -o json -I=0 '{.package.name: .package.version}' "$f"; done | jq -sc add)
          swept=$(yq -o=json -I=0 '[.workspaces[].crates[] | select((.version_files // []) | length > 0) | .name]' .anodizer.yaml)
          templates=$(yq -o=json -I=0 '.workspaces[].crates[] | {.name: .tag_template}' .anodizer.yaml | jq -sc add)
          tagged=$(git tag -l)
          if git symbolic-ref -q --short HEAD | grep -qx -f <(yq '.tag.release_branches[]' .anodizer.yaml); then on_release=1; else on_release=0; fi
          failed=0
          for ref in $(helm template cfgd chart/cfgd --set agent.enabled=true --set csiDriver.enabled=true \
              | sed -n 's/^ *image: *"\{0,1\}\(ghcr\.io\/tj-smith47\/cfgd[^" ]*\)"\{0,1\} *$/\1/p' | sort -u); do
            image=${ref##*/}; crate=${image%%:*}; tag=${image##*:}
            now=$(jq -rn --argjson m "$current" --arg c "$crate" '$m[$c] // empty')
            next=$(jq -rn --argjson m "${predicted:-{\}}" --arg c "$crate" '$m[$c] // empty')
            hand=$(jq -rn --argjson s "$swept" --arg c "$crate" '$s | index($c) == null')
            if [ "$hand" = true ] && [ -n "$next" ]; then expected=$next; else expected=$now; fi
            release_tag=$(jq -rn --argjson t "$templates" --arg c "$crate" --arg v "$tag" '$t[$c] // empty | sub("\\{\\{ *Version *\\}\\}"; $v)')
            if [ "$tag" = "$expected" ] && [ "$tag" = "$next" ]; then
              echo "OK       $ref (published by the release cut from this commit)"
            elif [ "$tag" = "$expected" ] && docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "OK       $ref"
            elif [ "$tag" = "$expected" ] && [ -n "$release_tag" ] && printf '%s\n' "$tagged" | grep -qxF "$release_tag" \
                && [ "$(git log -1 --format=%ct "$release_tag" 2>/dev/null || echo 0)" -gt "$(( $(date -u +%s) - 7200 ))" ]; then
              echo "OK       $ref (the release tagged $release_tag is still pushing its image)"
            elif [ "$tag" = "$expected" ]; then
              echo "MISSING  $ref"; failed=1
            elif [ "$hand" = true ] && [ "$on_release" = 0 ] && [ "$(printf '%s\n%s\n' "$now" "$tag" | sort -V | tail -1)" = "$tag" ]; then
              echo "OK       $ref (ahead of the released $now; the release branch checks it against the release it cuts)"
            else
              echo "STALE    $ref (expected $crate $expected)"; failed=1
            fi
          done
          exit $failed

  gen:crds:
    desc: Regenerate every CRD copy (Helm chart + OLM bundle + schemas/crds.yaml) from the cfgd-crd spec types.
    deps: [_check:tmp-headroom]
    cmds:
      - cargo run -q -p cfgd-operator --bin cfgd-gen-crds -- --out-dir chart/cfgd/crds
      - cargo run -q -p cfgd-operator --bin cfgd-gen-crds -- --out-dir ecosystem/olm/manifests
      - cargo run -q -p cfgd-operator --bin cfgd-gen-crds > schemas/crds.yaml

  gen:crds:check:
    desc: Verify every CRD copy (chart + OLM + schemas/crds.yaml) is up to date with the cfgd-crd spec types (CI drift guard).
    deps: [_check:tmp-headroom]
    cmds:
      - cmd: |
          set -e
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cargo run -q -p cfgd-operator --bin cfgd-gen-crds -- --out-dir "$tmp"
          cargo run -q -p cfgd-operator --bin cfgd-gen-crds > "$tmp/crds.yaml"
          for f in machineconfigs configpolicies clusterconfigpolicies driftalerts modules backuppolicies; do
            for tree in chart/cfgd/crds ecosystem/olm/manifests; do
              if ! diff -u "$tree/$f.yaml" "$tmp/$f.yaml"; then
                echo ""
                echo "ERROR: $tree/$f.yaml is out of date; run: task gen:crds"
                exit 1
              fi
            done
          done
          if ! diff -u schemas/crds.yaml "$tmp/crds.yaml"; then
            echo ""
            echo "ERROR: schemas/crds.yaml is out of date; run: task gen:crds"
            exit 1
          fi
          echo "all CRD copies up to date"

  schema:generate:
    desc: Regenerate the published editor-config JSON schemas (schemas/*.schema.json) from the Rust config structs.
    deps: [_check:tmp-headroom]
    cmds:
      - cargo run -q -p cfgd-core --bin cfgd-gen-schemas -- schemas

  schema:check:
    desc: Verify schemas/*.schema.json are up to date with the Rust config structs (CI drift guard).
    deps: [_check:tmp-headroom]
    cmds:
      - cmd: |
          set -e
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cargo run -q -p cfgd-core --bin cfgd-gen-schemas -- "$tmp"
          for f in cfgd-config cfgd-module cfgd-profile cfgd-source; do
            if ! diff -u "schemas/$f.schema.json" "$tmp/$f.schema.json"; then
              echo ""
              echo "ERROR: schemas/$f.schema.json is out of date; run: task schema:generate"
              exit 1
            fi
          done
          echo "schemas up to date"

  schema:bless:
    desc: Regenerate the committed golden schema snapshots (tests/golden/schema/*.json) after an intentional schema change. The golden TEST (every_kind_schema_matches_its_committed_golden, run by `task test`) is the drift gate; this target is its bless writer.
    deps: [_check:tmp-headroom]
    cmds:
      - CFGD_BLESS_SCHEMA=1 cargo test -p cfgd-core --features cfgd-core/test-helpers --test schema_golden every_kind_schema_matches_its_committed_golden

  skill:bless:
    desc: Regenerate the committed golden rendered skills (tests/snapshots/skill/*.SKILL.md) after an intentional provider-envelope change. The golden TEST (run by `task test`) is the drift gate; this target is its bless writer.
    deps: [_check:tmp-headroom]
    cmds:
      - CFGD_BLESS_SKILL=1 cargo test -p cfgd-core --features cfgd-core/test-helpers --test skill_golden

  test-only-files:bless:
    desc: Regenerate .claude/scripts/test-only-files.txt, the list of workspace files built only for tests that the shell audits read, after a module or fixture binary gains or loses its test gate. The pin test (test_only_files_list_matches_the_derivation, run by `task test`) is the drift gate; this target is its bless writer.
    deps: [_check:tmp-headroom]
    cmds:
      - CFGD_BLESS_TEST_ONLY_FILES=1 cargo test -p cfgd-core --features cfgd-core/test-helpers --lib test_only_files_list_matches_the_derivation

  coverage:check:
    desc: Run workspace test coverage and write cobertura.xml. Prints the same percentage the README badge shows. No branch switching, no push.
    cmds:
      - cargo llvm-cov nextest {{.LLVM_COV_IGNORE}} --cobertura --output-path cobertura.xml --no-fail-fast
      - 'echo "Coverage (line, cobertura): $(bash .claude/scripts/coverage-percent.sh cobertura.xml)"'

  coverage:publish:
    desc: Run workspace test coverage and publish the badge update to origin/badges. Switches branches via the badge script; release/CI only.
    cmds:
      - cargo llvm-cov nextest {{.LLVM_COV_IGNORE}} --cobertura --output-path cobertura.xml --no-fail-fast
      - bash .claude/scripts/coverage-percent.sh cobertura.xml
      - bash .claude/scripts/publish-coverage.sh cobertura.xml

  coverage:gate:
    desc: "Coverage floor gate: run the instrumented suite quietly (full output in target/coverage-gate.log), then fail below the floor (default 92.5; override via COVERAGE_FLOOR)."
    deps: [_check:tmp-headroom]
    cmds:
      # The instrumented run spews thousands of compile/test lines; keep the
      # terminal to percent + verdict and park the rest in a logfile.
      - mkdir -p target
      - |
        if ! cargo llvm-cov nextest {{.LLVM_COV_IGNORE}} --cobertura --output-path cobertura.xml --no-fail-fast > target/coverage-gate.log 2>&1; then
          echo "instrumented test run failed; tail of target/coverage-gate.log:" >&2
          tail -n 40 target/coverage-gate.log >&2
          exit 1
        fi
      - task: coverage:floor

  coverage:floor:
    desc: "Check an EXISTING cobertura.xml against the coverage floor (default 92.5; override via COVERAGE_FLOOR) without re-running the instrumented suite. Pair with coverage:check/coverage:publish."
    preconditions:
      - sh: test -f cobertura.xml
        msg: "cobertura.xml not found; run task coverage:check (or coverage:publish) first."
    cmds:
      - |
        # --raw gives the unrounded percent so a 92.99 can't pass as the
        # badge's rounded 93; the badge form is shown alongside for context.
        floor="${COVERAGE_FLOOR:-92.5}"
        pct=$(bash .claude/scripts/coverage-percent.sh --raw cobertura.xml)
        badge=$(bash .claude/scripts/coverage-percent.sh cobertura.xml)
        if awk -v p="$pct" -v f="$floor" 'BEGIN { exit !(p + 0 >= f + 0) }'; then
          echo "coverage ${pct}% (badge ${badge}) meets floor ${floor}%: PASS"
        else
          echo "coverage ${pct}% (badge ${badge}) below floor ${floor}%: FAIL" >&2
          exit 1
        fi

  audit:test:
    desc: Validate audit.sh's banned-pattern rules against paired fixtures
    cmds:
      - bash .claude/scripts/audit-tests/audit-test.sh

  package:
    desc: Dry-run package all publishable crates (verify build included)
    deps: [_check:tmp-headroom]
    cmds:
      # The verify build resolves siblings from target/package/tmp-registry, and
      # cargo holds a registry package immutable at <name>-<version>: the unpack
      # under ~/.cargo/registry/src is never refreshed once .cargo-ok exists, and
      # the rlib built from it is reused without re-reading the source. Between
      # two version bumps both are stale, so verify compiles the crate under test
      # against an older copy of its sibling. Drop this workspace's, unpack and build alike;
      # an index.crates.io-* unpack is a real published crate and is never touched.
      # The build half globs every profile dir, debug/ and the rest: the
      # verify runs in dev today, and a profile the flag or config moves it to
      # would leave the stale rlib in a dir a debug-only scan cannot see.
      - |
        tgt="${CARGO_TARGET_DIR:-target}"
        src="${CARGO_HOME:-$HOME/.cargo}/registry/src"
        crates=$(cargo metadata --no-deps --format-version 1 \
          | grep -o '"name":"[^"]*","version":"[^"]*"' \
          | sed 's/"name":"\([^"]*\)","version":"\([^"]*\)"/\1-\2/')
        [ -n "$crates" ] || exit 0
        for crate in $crates; do
          for d in "$src"/*/"$crate"; do
            case "$d" in "$src"/index.crates.io-*) continue ;; esac
            if [ -d "$d" ]; then rm -rf "$d"; fi
          done
        done
        # A version may carry ERE metacharacters (1.0.0+build, and every dot),
        # and an unescaped pattern matches nothing: the unpack would go while
        # the stale rlib naming it stayed, which is the staleness this removes.
        pat=$(printf '%s\n' "$crates" \
          | sed 's/[][^$.*+?(){}|\\]/\\&/g' \
          | sed 's|.*|registry/src/[^ ]*/&/|' \
          | tr '\n' '|' | sed 's/|$//')
        # A plain newline-delimited read. `grep -lZ` + `read -d ''` fails here: the
        # task runs under `sh`, whose `read` has no `-d`, so the NUL form failed
        # on every iteration and the loop body never ran (silently, exit 0,
        # one `read: invalid option "-d"` per file), leaving every stale rlib in
        # place, which is how a `cargo package` verify came to compile the CLI
        # against a sibling rmeta predating the API it had just been given.
        # Nothing under `target/` carries a newline.
        grep -lE "$pat" "$tgt"/*/deps/*.d 2>/dev/null | while IFS= read -r f; do
          h=${f##*-}; h=${h%.d}
          d=${f%/deps/*}
          rm -rf "$d"/deps/*-"$h" "$d"/deps/*-"$h".* "$d"/.fingerprint/*-"$h"
        done
      # No --no-verify: the verify build compiles each crate FROM ITS TARBALL,
      # the only local gate that catches sources escaping the crate directory
      # (e.g. include_str! of workspace-root files), which packages fine but
      # fails the release run's cargo publish verify. `--workspace` packages a
      # `publish = false` member too, and a test-only crate's path dependency on
      # a sibling carries no version, so every unpublishable member is excluded
      # by reading the flag off the manifests.
      - |
        cargo package --workspace --allow-dirty \
          $(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish == []) | "--exclude \(.name)"')

  snapshot:
    desc: Dry-run release pipeline (single target, no publish) using anodizer
    deps: [build]
    cmds:
      # ANODIZER_BIN swaps in a specific anodizer binary (see `task commit:local`)
      # when the installed release predates the .anodizer.yaml schema during a
      # coordinated anodizer+cfgd version bump. Defaults to the installed binary.
      - '${ANODIZER_BIN:-anodizer} release --snapshot --single-target --clean --dry-run'

  # --- Pre-commit pipeline (mirrors anodizer/Taskfile.yml) ---

  tidy:
    desc: Format code
    cmds:
      - task: fmt

  lint:
    desc: Local pre-commit check (tidy, clippy, audit, shellcheck, build, snapshot dry-run, installer:shellcheck); the rustdoc gate runs in CI and ahead of `task push`.
    cmds:
      - task: tidy
      - task: clippy
      - task: audit
      - task: shellcheck
      - task: build
      - task: snapshot
      - task: installer:shellcheck

  commit:
    desc: "Lint (regenerates artifacts), re-stage only the user's intended files, then commit. A breaking signal (a `!` subject marker, a `BREAKING CHANGE` footer or `#major`) on a crate below 1.0 is refused unless BREAKING_CHANGE_APPROVED=1, which only the user sets. A subject over 100 characters or without a `type(scope): ` prefix, or wording in .claude/scripts/commit-wording.txt, is refused outright. Usage: stage with `git add` first, then `task commit -- -m 'msg'`."
    preconditions:
      - sh: test -n "$(git diff --cached --name-only)"
        msg: "Nothing staged. Stage files with `git add <path>` before running task commit."
    vars:
      STAGED_PRE:
        sh: git diff --cached --name-only
      MODIFIED_PRE:
        sh: git diff --name-only
    cmds:
      - task: lint
      - task: _commit:restage
        vars:
          STAGED_LIST: "{{.STAGED_PRE}}"
          MODIFIED_LIST: "{{.MODIFIED_PRE}}"
      - .claude/scripts/commit-guard.sh {{.CLI_ARGS}}

  commit:quick:
    desc: "Lightweight commit: commit already-staged files WITHOUT the lint/snapshot chain. Use only when the full `task commit` is blocked by an issue unrelated to the staged change AND the code gates (fmt/clippy/test/audit) were run manually. A breaking signal (a `!` subject marker, a `BREAKING CHANGE` footer or `#major`) on a crate below 1.0 is refused unless BREAKING_CHANGE_APPROVED=1, which only the user sets. A subject over 100 characters or without a `type(scope): ` prefix, or wording in .claude/scripts/commit-wording.txt, is refused outright. Usage: `git add <paths>` first, then `task commit:quick -- -F msg.txt` (or `-- -m 'msg'`)."
    preconditions:
      - sh: test -n "$(git diff --cached --name-only)"
        msg: "Nothing staged. Stage files with `git add <path>` before running task commit:quick."
    cmds:
      - .claude/scripts/commit-guard.sh {{.CLI_ARGS}}

  commit:local:
    desc: "Like `task commit`, but runs the snapshot dry-run with a locally-built anodizer in place of the installed one. Use during a coordinated anodizer+cfgd bump when the installed anodizer predates the .anodizer.yaml schema (e.g. new v0.10 fields the released binary rejects). Build it first (`cargo build --release -p anodizer` in the anodizer repo). Override the path with ANODIZER_LOCAL=... . A breaking signal (a `!` subject marker, a `BREAKING CHANGE` footer or `#major`) on a crate below 1.0 is refused unless BREAKING_CHANGE_APPROVED=1, which only the user sets. A subject over 100 characters or without a `type(scope): ` prefix, or wording in .claude/scripts/commit-wording.txt, is refused outright. Usage: `git add` first, then `task commit:local -- -m 'msg'`."
    vars:
      ANODIZER_LOCAL: '{{.ANODIZER_LOCAL | default "/opt/repos/anodizer/target/release/anodizer"}}'
    preconditions:
      - sh: test -x "{{.ANODIZER_LOCAL}}"
        msg: "No local anodizer at {{.ANODIZER_LOCAL}}. Build it (`cargo build --release -p anodizer` in the anodizer repo) or pass ANODIZER_LOCAL=/path/to/anodizer."
    cmds:
      # Set ANODIZER_BIN in the process env of a fresh `task commit`; go-task
      # propagates process env (not task-level env) to nested task calls, so the
      # snapshot step inside the commit chain picks up the local binary.
      - ANODIZER_BIN="{{.ANODIZER_LOCAL}}" task commit -- {{.CLI_ARGS}}

  _commit:restage:
    internal: true
    desc: "Internal: re-stage files that were staged at task start (capture lint touchups) plus any files lint NEWLY modified (auto-generated content). Files modified-but-unstaged at task start are left untouched so they don't contaminate the commit."
    cmds:
      - |
        # (a) Re-add files that were staged pre-task. Use -A so deletes and
        # renames staged with `git mv` aren't lost when lint touches them.
        while IFS= read -r f; do
          [ -n "$f" ] && { git add -A -- "$f" 2>/dev/null || git rm --cached -- "$f" 2>/dev/null || true; }
        done <<'STAGED_EOF'
        {{.STAGED_LIST}}
        STAGED_EOF
        # (b) Add files that lint NEWLY modified, i.e. absent from the pre-task
        # staged OR modified lists. These are typically docs / snapshots
        # regenerated by the lint step and belong with the commit.
        git diff --name-only | while IFS= read -r f; do
          [ -z "$f" ] && continue
          printf '%s\n' '{{.STAGED_LIST}}' | grep -qxF -- "$f" && continue
          printf '%s\n' '{{.MODIFIED_LIST}}' | grep -qxF -- "$f" && continue
          git add -- "$f"
        done

  check:windows:
    desc: "Type-check the cfg(windows) code paths that no Linux/macOS/FreeBSD build compiles."
    # `task ci` deliberately excludes cross-platform builds, so a signature change
    # that misses a #[cfg(windows)] call site type-checks clean on every other
    # host and only fails on the Windows CI runner, after the push. Needs the
    # mingw target (rustup target add x86_64-pc-windows-gnu) plus mingw-w64. The
    # gnu target, because ring's build script rejects a GNU
    # compiler for msvc, aborting the check before any cfgd crate is reached.
    cmds:
      - cargo check --target x86_64-pc-windows-gnu -p cfgd-core -p cfgd

  push:
    desc: "Rustdoc- and coverage-gated push. Usage: task push [-- <git push args>] (defaults to origin master)."
    preconditions:
      # Uncommitted changes must not ride along on a push decision: gate the
      # coverage run and the push on a clean tree.
      - sh: git diff --quiet && git diff --cached --quiet
        msg: "Working tree is dirty: commit your changes before task push."
    cmds:
      # The rustdoc gate is otherwise CI's alone; a push is the one local step
      # that should not learn about a broken doc link from CI.
      - task: doc
      - task: coverage:gate
      - git push {{.CLI_ARGS | default "origin master"}}

  ci:
    desc: Run all CI checks (everything except cross-platform builds and the rustdoc gate, which CI and `task push` run)
    cmds:
      - task: fmt:check
      - task: clippy
      - task: schema:check
      - task: gen:crds:check
      - task: version-files:check
      - task: chart:tags:check
      - task: chart:test
      - task: e2e:tags:check
      - task: installer:test
      - task: test
      - task: test:threads
      - task: audit
      - task: audit:test
      - task: shellcheck
      - task: package

  # --- E2E ---

  e2e:setup:
    desc: Build images and ensure E2E infrastructure is current
    # Every suite target depends on it, and `task e2e` reaches it through each
    # of them; one invocation installs the run once.
    run: once
    # Skipped (no-op) when CFGD_E2E_SETUP_DONE=1. CI's setup job runs once
    # and sets this for downstream leaf jobs so they don't re-build images
    # or require docker.sock on runner pods that lack it.
    status:
      - test -n "${CFGD_E2E_SETUP_DONE:-}"
    cmds:
      - bash tests/e2e/setup-cluster.sh

  e2e:
    desc: Run all E2E test suites
    cmds:
      - defer: { task: e2e:pr-install:down }
      - task: e2e:setup
      - task: e2e:cli
      - task: e2e:node
      - task: e2e:node:helm
      - task: e2e:node:server
      - task: e2e:operator
      - task: e2e:full-stack
      - task: e2e:crossplane
      - task: e2e:gateway

  e2e:pr-install:down:
    desc: Delete the run's cfgd.io objects (TeamConfigs included) while its operator can clear their finalizers, then the Crossplane suite's Composition and Function, then remove the PR install of the operator and CSI driver and read back that the CSIDriver, webhook configurations, Function and Composition are gone and report the namespace's phase.
    cmds:
      - bash tests/e2e/pr-install-down.sh

  e2e:cli:
    desc: Run CLI exhaustive E2E tests
    env:
      NO_COLOR: '{{.NO_COLOR | default "1"}}'
      EDITOR: '{{.EDITOR | default "true"}}'
    cmds:
      - cargo build --release --bin cfgd
      - bash tests/e2e/cli/scripts/run-all.sh

  e2e:node:
    desc: Run node E2E tests (binary, drift, daemon)
    deps: [e2e:setup]
    cmds:
      - bash tests/e2e/node/scripts/run-all.sh

  e2e:node:helm:
    desc: Run node Helm E2E tests
    deps: [e2e:setup]
    cmds:
      - bash tests/e2e/node/scripts/test-helm.sh

  e2e:node:server:
    desc: Run node server integration E2E tests
    deps: [e2e:setup]
    cmds:
      - bash tests/e2e/node/scripts/test-server.sh

  e2e:operator:
    desc: Run operator E2E tests
    deps: [e2e:setup]
    cmds:
      - bash tests/e2e/operator/scripts/run-all.sh

  e2e:full-stack:
    desc: Run full-stack E2E tests
    deps: [e2e:setup]
    cmds:
      - bash tests/e2e/full-stack/scripts/run-all.sh

  e2e:crossplane:
    desc: Run Crossplane E2E tests
    deps: [e2e:setup]
    cmds:
      - bash tests/e2e/crossplane/scripts/run-crossplane-tests.sh

  e2e:gateway:
    desc: Run gateway E2E tests
    deps: [e2e:setup]
    cmds:
      - bash tests/e2e/gateway/scripts/run-all.sh

  # --- Clean ---

  clean:
    desc: Remove build artifacts
    cmds:
      - cargo clean

  clean:bloat:
    desc: One-shot reclaim of session build-cache bloat (incremental cache, cross-target dirs, stale scratch target dirs). Safe to run between work; do NOT run while a build is live in a scratch dir.
    cmds:
      - df -h / | tail -1
      # Incremental cache regrows unboundedly across test cycles; deleting costs one warm rebuild.
      - rm -rf target/debug/incremental
      # Cross-compile targets are check-only artifacts, rebuilt on demand.
      - find target -maxdepth 1 -type d -name 'x86_64-*' -exec rm -rf {} +
      - find target -maxdepth 1 -type d -name 'aarch64-*' -exec rm -rf {} +
      # Any dir under the debug scratch root holding a CACHEDIR.TAG is a redirected
      # cargo target dir, always regenerable. Logs/reports/sandboxes are untouched.
      - |
        for tag in $(find ~/.cache/cfgd-debug -maxdepth 3 -name CACHEDIR.TAG 2>/dev/null); do
          rm -rf "$(dirname "$tag")"
        done
      # target/debug/deps accumulates one set of test binaries per rebuild and cargo
      # never collects the superseded ones, so it reached 76G in a single day of test
      # cycles. Age-based sweeping cannot reach it: every run stats every artifact, so
      # nothing is ever old. Capping by SIZE evicts oldest-first until the cap holds.
      - cargo sweep --maxsize {{.TARGET_MAXSIZE}} || true
      - df -h / | tail -1

  # --- Docker ---

  docker:
    desc: Build all Docker images
    deps: [docker:cli, docker:operator]

  docker:cli:
    desc: Build cfgd CLI Docker image
    vars: *artifact-vars
    cmds:
      - docker build -f Dockerfile -t {{.REGISTRY}}/cfgd:latest -t {{.REGISTRY}}/cfgd:{{.VERSION_NUM}} .

  docker:operator:
    desc: Build cfgd-operator Docker image
    vars: *artifact-vars
    cmds:
      - docker build -f Dockerfile.operator -t {{.REGISTRY}}/cfgd-operator:latest -t {{.REGISTRY}}/cfgd-operator:{{.VERSION_NUM}} .

  image:push:
    desc: Push all Docker images to registry
    deps: [image:push:cli, image:push:operator]

  image:push:cli:
    desc: Push cfgd CLI image to registry
    vars: *artifact-vars
    cmds:
      - docker push {{.REGISTRY}}/cfgd:latest
      - docker push {{.REGISTRY}}/cfgd:{{.VERSION_NUM}}

  image:push:operator:
    desc: Push cfgd-operator image to registry
    vars: *artifact-vars
    cmds:
      - docker push {{.REGISTRY}}/cfgd-operator:latest
      - docker push {{.REGISTRY}}/cfgd-operator:{{.VERSION_NUM}}

  # --- Release ---

  release:local:
    desc: Build release archive locally
    deps: [_check:tmp-headroom]
    vars: *artifact-vars
    cmds:
      # Archive name mirrors .anodizer.yaml's archives name_template
      # (ProjectName-Version-Os-Arch); keep the two in lockstep or
      # locally-built archives stop matching what releases ship.
      - cargo build --release --bin cfgd
      - tar -czf "cfgd-{{.VERSION_NUM}}-{{.OS}}-{{.ARCH}}.tar.gz" -C target/release cfgd
      - echo "Built{{":"}} cfgd-{{.VERSION_NUM}}-{{.OS}}-{{.ARCH}}.tar.gz"

  # --- Demo ---

  demo:
    desc: Re-record the README demo end to end (binary, image, VHS take, GIF).
    cmds:
      - task: demo:record
      - task: demo:gif

  demo:binary:
    desc: Build the statically-linked cfgd the demo image copies in.
    cmds:
      - bash demo/scripts/build-binary.sh

  demo:image:
    desc: Build the bare Ubuntu image the tape records against.
    deps: [demo:binary]
    cmds:
      - docker build -f demo/Dockerfile -t cfgd-demo:latest .

  demo:record:
    desc: Run demo/init.tape, producing whatever its Output line names (demo/.out/raw/).
    # The take records whatever cfgd-demo:latest holds, so the image is rebuilt
    # from this checkout first; otherwise the take is stamped with a commit its
    # binary was never built from.
    deps: [demo:image]
    preconditions:
      # LazyVim's tree, tabline and statusline are Nerd Font glyphs; without the
      # font VHS still exits 0 and records a take full of tofu boxes. The font
      # is read from the tape itself so the gate cannot drift from what VHS
      # will actually request. Both checks run the SAME extraction (a looser
      # declaration grep here once accepted a line the extraction below could
      # not parse, leaving `grep -qF ""` to match anything), and the membership
      # check re-guards non-empty so it cannot pass vacuously on its own.
      - sh: >-
          [ -n "$(sed -n 's/^Set FontFamily "\(.*\)"$/\1/p' demo/init.tape | head -1)" ]
        msg: "demo/init.tape declares no parseable `Set FontFamily \"…\"` line, so the gate cannot know which font VHS will render."
      - sh: >-
          font="$(sed -n 's/^Set FontFamily "\(.*\)"$/\1/p' demo/init.tape | head -1)";
          [ -n "$font" ] && fc-list : family | grep -qF "$font"
        msg: "The font demo/init.tape asks for is not installed, so the take would record tofu boxes in place of LazyVim's glyphs. Check `Set FontFamily` in the tape against `fc-list : family`."
    cmds:
      - bash demo/scripts/chromium-no-sandbox.sh
      - bash demo/scripts/record.sh

  demo:gif:
    desc: Ramp the raw take into the README GIF (1:1 at both ends, fast in the middle).
    cmds:
      - bash demo/scripts/make-gif.sh

  demo:drift:
    desc: Record the drift-heal demo end to end (image, VHS take, flat GIF).
    preconditions:
      # Same font gate as demo:record, pointed at demo/drift.tape. That
      # target's comment says why both checks read the font from the tape.
      - sh: >-
          [ -n "$(sed -n 's/^Set FontFamily "\(.*\)"$/\1/p' demo/drift.tape | head -1)" ]
        msg: "demo/drift.tape declares no parseable `Set FontFamily \"…\"` line, so the gate cannot know which font VHS will render."
      - sh: >-
          font="$(sed -n 's/^Set FontFamily "\(.*\)"$/\1/p' demo/drift.tape | head -1)";
          [ -n "$font" ] && fc-list : family | grep -qF "$font"
        msg: "The font demo/drift.tape asks for is not installed, so the take would record tofu boxes in place of LazyVim's glyphs. Check `Set FontFamily` in the tape against `fc-list : family`."
    cmds:
      - task: demo:image
      - bash demo/scripts/chromium-no-sandbox.sh
      - bash demo/scripts/record.sh drift
      - bash demo/scripts/make-gif-flat.sh drift

  demo:author:
    desc: Record the CLI-authoring demo end to end (image, VHS take, flat GIF).
    preconditions:
      # Same font gate as demo:record/demo:drift, pointed at demo/author.tape.
      # demo:record's comment says why both checks read the font from the tape.
      - sh: >-
          [ -n "$(sed -n 's/^Set FontFamily "\(.*\)"$/\1/p' demo/author.tape | head -1)" ]
        msg: "demo/author.tape declares no parseable `Set FontFamily \"…\"` line, so the gate cannot know which font VHS will render."
      - sh: >-
          font="$(sed -n 's/^Set FontFamily "\(.*\)"$/\1/p' demo/author.tape | head -1)";
          [ -n "$font" ] && fc-list : family | grep -qF "$font"
        msg: "The font demo/author.tape asks for is not installed, so the take would record tofu boxes in place of LazyVim's glyphs. Check `Set FontFamily` in the tape against `fc-list : family`."
    cmds:
      - task: demo:image
      - bash demo/scripts/chromium-no-sandbox.sh
      - bash demo/scripts/record.sh author
      - bash demo/scripts/make-gif-flat.sh author

  demo:backup:
    desc: Record the backup-restore demo end to end (image, VHS take, flat GIF).
    preconditions:
      # Same font gate as demo:record/demo:drift/demo:author, pointed at
      # demo/backup.tape. demo:record's comment says why both checks read the
      # font from the tape.
      - sh: >-
          [ -n "$(sed -n 's/^Set FontFamily "\(.*\)"$/\1/p' demo/backup.tape | head -1)" ]
        msg: "demo/backup.tape declares no parseable `Set FontFamily \"…\"` line, so the gate cannot know which font VHS will render."
      - sh: >-
          font="$(sed -n 's/^Set FontFamily "\(.*\)"$/\1/p' demo/backup.tape | head -1)";
          [ -n "$font" ] && fc-list : family | grep -qF "$font"
        msg: "The font demo/backup.tape asks for is not installed, so the take would record tofu boxes in place of the real glyphs. Check `Set FontFamily` in the tape against `fc-list : family`."
    cmds:
      - task: demo:image
      - bash demo/scripts/chromium-no-sandbox.sh
      - bash demo/scripts/record.sh backup
      - bash demo/scripts/make-gif-flat.sh backup

