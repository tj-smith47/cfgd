version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    # Group routine version bumps into one weekly PR. Security updates bypass
    # the version group, so they carry a group of their own and arrive as one
    # PR per ecosystem on an advisory day instead of one per dependency.
    groups:
      cargo:
        patterns: ["*"]
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "gomod"
    directory: "/function-cfgd"
    schedule:
      interval: "weekly"
      day: "saturday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      go-modules:
        patterns: ["*"]
      go-modules-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    # `directory: "/"` reaches .github/workflows plus a ROOT-level action.yml —
    # it never descends into .github/actions/<name>/action.yml, so the pins in
    # all seven composite actions go untracked and rot behind the workflows
    # Dependabot does see. Only the plural `directories` key accepts globs.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "saturday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Self-managed: the floating @v1 is moved by anodizer-action's own
      # release (semantic-release + update-major-tag). Don't let Dependabot
      # track it; a v2 cutover is a deliberate manual bump.
      - dependency-name: "tj-smith47/anodizer-action"
  - package-ecosystem: "docker"
    # DOCKER_REGEXP is a substring match, so the Dockerfile.<suffix> /
    # <prefix>.Dockerfile variants are detected — but only at the configured
    # directory level (not recursively), so each dir holding a Dockerfile is
    # listed explicitly.
    directories:
      - "/"
      - "/function-cfgd"
      - "/tests/e2e/cli"
      - "/ecosystem/olm"
      - "/demo"
    schedule:
      interval: "weekly"
      day: "saturday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      docker:
        patterns: ["*"]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
