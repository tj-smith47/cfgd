name: "Setup protoc"
description: "Install the protoc compiler from protocolbuffers/protobuf releases (composite, no Node runtime)."

inputs:
  version:
    description: "protoc release version to install (without the leading 'v')."
    required: false
    default: "25.9"

runs:
  using: "composite"
  steps:
    # Composite over arduino/setup-protoc@v3: that action's latest release
    # runs on node20 (no node24 build exists), tripping the GHA Node 20
    # deprecation warning. A composite action is pure shell, so it carries
    # no Node runtime and never deprecates on a Node bump.
    - name: Install protoc
      shell: bash
      env:
        PROTOC_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        os="$(uname -s)"
        arch="$(uname -m)"

        case "$os" in
          Linux)
            case "$arch" in
              x86_64|amd64)        asset="protoc-${PROTOC_VERSION}-linux-x86_64.zip" ;;
              aarch64|arm64)       asset="protoc-${PROTOC_VERSION}-linux-aarch_64.zip" ;;
              *) echo "::error::Unsupported Linux arch: $arch"; exit 1 ;;
            esac
            ;;
          Darwin)
            case "$arch" in
              x86_64)              asset="protoc-${PROTOC_VERSION}-osx-x86_64.zip" ;;
              arm64|aarch64)       asset="protoc-${PROTOC_VERSION}-osx-aarch_64.zip" ;;
              *) echo "::error::Unsupported macOS arch: $arch"; exit 1 ;;
            esac
            ;;
          # Git-bash on windows runners reports MINGW64_NT / MSYS_NT for uname.
          MINGW*|MSYS*|CYGWIN*|Windows*)
            asset="protoc-${PROTOC_VERSION}-win64.zip"
            ;;
          *)
            echo "::error::Unsupported OS: $os"; exit 1 ;;
        esac

        url="https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${asset}"
        dest="${RUNNER_TEMP}/protoc"
        mkdir -p "$dest"

        # One pinned digest per asset this action can select, so the zip that
        # produces every runner's protoc is verified rather than trusted: the
        # protobuf releases publish no checksums file, which is exactly why the
        # digest has to live here. An asset with no pinned digest — a version
        # bumped without recomputing them — is refused rather than trusted.
        case "$asset" in
          protoc-25.9-linux-x86_64.zip)  sha="88f2d0c78a1072c4f84c59e9f9785b74849953e882a573188bc2d0518915b03e" ;;
          protoc-25.9-linux-aarch_64.zip) sha="16dcc7d435b8a117c31470e8dd85d82bdace5e5d485d2b901573854e4330e006" ;;
          protoc-25.9-osx-x86_64.zip)    sha="387ad924f98fee962285ff3c5d63e1c6c666ea76ba339fb506afa56d74372c60" ;;
          protoc-25.9-osx-aarch_64.zip)  sha="11e91bb16fc52f5691970a3fb57c6eb26e13065a2eff1eea226b0dcd698ddb6d" ;;
          protoc-25.9-win64.zip)         sha="5abb0d741dea2d3df034e1cae5bad4fe014fb5fe3b982b55109bf783fded0d83" ;;
          *) echo "::error::No pinned digest for ${asset}; recompute the table in this action when bumping the version"; exit 1 ;;
        esac

        echo "Downloading $url"
        curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 10 \
          -o "${RUNNER_TEMP}/${asset}" "$url"
        # Git Bash on windows runners carries no perl, so no `shasum`; macOS
        # carries no coreutils, so no `sha256sum`. Whichever this runner has
        # verifies — the check is never skipped for want of a checker.
        if command -v sha256sum >/dev/null 2>&1; then
          echo "${sha}  ${RUNNER_TEMP}/${asset}" | sha256sum -c -
        else
          echo "${sha}  ${RUNNER_TEMP}/${asset}" | shasum -a 256 -c -
        fi
        unzip -o -q "${RUNNER_TEMP}/${asset}" -d "$dest"

        # The protoc zip lays out bin/protoc (bin/protoc.exe on windows).
        # GITHUB_PATH entries must use the runner-native path separator; on
        # windows runners $GITHUB_PATH is consumed by pwsh/cmd which want a
        # backslash drive path, so translate the msys /c/... form.
        bindir="${dest}/bin"
        case "$os" in
          MINGW*|MSYS*|CYGWIN*|Windows*)
            bindir="$(cygpath -w "$bindir")"
            ;;
        esac
        echo "$bindir" >> "$GITHUB_PATH"
        # Make protoc resolvable for the verify step in this same shell, which
        # runs before the appended $GITHUB_PATH entry takes effect.
        export PATH="${dest}/bin:${PATH}"

        "${dest}/bin/protoc" --version
